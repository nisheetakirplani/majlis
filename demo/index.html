<!doctype html>
<html lang="en" data-brand="majlis">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Majlis Brand Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="min-h-screen">
  <!-- Toolbar: switches data-brand, which swaps every brand variable -->
  <header class="sticky top-0 z-10 flex flex-wrap items-center gap-3 border-b border-border bg-surface px-4 py-3">
    <p class="mr-auto text-sm text-text-secondary">Same HTML, same classes. Only <code class="font-mono text-text-primary">data-brand</code> changes.</p>
    <div class="flex rounded-lg border border-border p-1" role="group" aria-label="Brand">
      <button type="button" data-set-brand="majlis" class="brand-btn rounded-md px-3 py-1.5 text-sm font-semibold">Majlis</button>
      <button type="button" data-set-brand="brand1" class="brand-btn rounded-md px-3 py-1.5 text-sm font-semibold">Brand1</button>
      <button type="button" data-set-brand="compare" class="brand-btn rounded-md px-3 py-1.5 text-sm font-semibold">Side by side</button>
    </div>
  </header>

  <main id="stage" class="grid gap-6 p-4 md:p-6"></main>

  <!-- One app screen built only from semantic token utilities -->
  <template id="screen">
    <section class="screen overflow-hidden rounded-lg border border-border bg-bg-subtle">
      <p class="brand-label border-b border-border bg-surface px-4 py-2 text-xs font-semibold uppercase tracking-wide text-text-secondary"></p>
      <div class="flex flex-col gap-4 p-4 lg:flex-row">
        <!-- Sidebar -->
        <aside class="flex shrink-0 flex-col gap-3 lg:w-56">
          <div class="rounded-lg bg-surface p-3 shadow-sm">
            <div class="mb-3 flex items-center gap-2">
              <span class="grid size-8 place-items-center rounded-md bg-gradient-aurora-green text-text-inverse">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg>
              </span>
              <span class="font-heading font-semibold">Majlis AI</span>
            </div>
            <button class="flex w-full items-center justify-center gap-2 rounded-md bg-action-primary-bg px-3 py-2 text-sm font-semibold text-action-primary-text hover:bg-action-primary-bg-hover">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              New chat
            </button>
          </div>
          <nav class="rounded-lg bg-surface p-2 text-sm shadow-sm">
            <a class="flex items-center gap-2 rounded-md bg-action-tertiary-bg-selected px-3 py-2 font-semibold text-action-tertiary-text" href="#">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
            <a class="flex items-center gap-2 rounded-md px-3 py-2 text-text-secondary hover:bg-action-tertiary-bg-hover" href="#">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/></svg>Documents</a>
            <a class="flex items-center gap-2 rounded-md px-3 py-2 text-text-secondary hover:bg-action-tertiary-bg-hover" href="#">
              <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analytics
              <span class="ml-auto rounded-full bg-info-bg px-2 text-xs text-info-text">New</span></a>
          </nav>
          <div class="rounded-lg bg-action-primary-bg p-4 text-action-primary-text">
            <p class="font-heading text-lg font-bold">Premium plan</p>
            <p class="mb-3 text-xs opacity-90">Pick the plan and unlock all features</p>
            <button class="w-full rounded-md bg-surface px-3 py-2 text-sm font-semibold text-action-secondary-text">Upgrade now</button>
          </div>
        </aside>

        <!-- Main -->
        <div class="flex min-w-0 flex-1 flex-col items-center gap-5 rounded-lg bg-surface p-6 shadow-sm">
          <span class="relative mt-4 size-16 rounded-full bg-gradient-aurora-green shadow-lg">
            <span class="absolute left-[38%] top-[42%] h-3 w-1.5 rounded-full bg-brand-deep"></span>
            <span class="absolute left-[56%] top-[42%] h-3 w-1.5 rounded-full bg-brand-deep"></span>
          </span>
          <div class="text-center">
            <h1 class="font-heading text-3xl font-bold tracking-tight">Good afternoon, Syed.</h1>
            <p class="text-text-secondary">What are we working on?</p>
          </div>
          <div class="w-full max-w-xl rounded-lg border border-border bg-surface p-3 shadow-sm">
            <p class="mb-6 text-text-tertiary">Just ask…</p>
            <div class="flex items-center gap-2">
              <span class="rounded-full border border-border px-3 py-1 text-xs text-text-secondary">Institutional Memory</span>
              <button class="ml-auto grid size-9 place-items-center rounded-full bg-action-primary-bg text-action-primary-text" aria-label="Send">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>
          <div class="grid w-full max-w-xl gap-3 sm:grid-cols-2">
            <div class="flex gap-3 rounded-lg border border-border p-3">
              <span class="grid size-8 shrink-0 place-items-center rounded-md bg-brand-tint-faint text-icon-brand">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l3 3v15H6z"/></svg></span>
              <div><p class="text-sm font-semibold">Summarise this week’s board documents</p><p class="text-xs text-text-secondary">Decisions, risks and owners</p></div>
            </div>
            <div class="flex gap-3 rounded-lg border border-border p-3">
              <span class="grid size-8 shrink-0 place-items-center rounded-md bg-brand-tint-faint text-icon-brand">
                <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7"/></svg></span>
              <div><p class="text-sm font-semibold">Compare Q3 revenue by region</p><p class="text-xs text-text-secondary">Variance against plan</p></div>
            </div>
          </div>
          <div class="w-full max-w-xl">
            <div class="mb-1 flex justify-between text-xs text-text-secondary"><span>57.5k / 200k</span><span>28.75%</span></div>
            <div class="h-1.5 rounded-full bg-progress-track"><div class="h-1.5 w-[29%] rounded-full bg-progress-fill"></div></div>
          </div>
          <div class="flex flex-wrap justify-center gap-2 text-xs">
            <span class="rounded-full bg-success-bg px-2 py-1 text-success-text">Success</span>
            <span class="rounded-full bg-warning-bg px-2 py-1 text-warning-text">Warning</span>
            <span class="rounded-full bg-error-bg px-2 py-1 text-error-text">Error</span>
            <span class="rounded-full bg-brand-accent px-2 py-1 text-brand-on-accent">Brand accent</span>
          </div>
        </div>
      </div>
    </section>
  </template>

  <script>
    const stage = document.getElementById('stage');
    const tpl = document.getElementById('screen');
    const LABELS = { majlis: 'Majlis · emerald · Plus Jakarta Sans', brand1: 'Brand1 · #E4572E · Poppins + Manrope' };
    function screen(brand) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      if (brand) node.dataset.brand = brand;
      node.querySelector('.brand-label').textContent = LABELS[brand || document.documentElement.dataset.brand];
      return node;
    }
    function show(mode) {
      stage.replaceChildren();
      if (mode === 'compare') {
        stage.className = 'grid gap-6 p-4 md:p-6 xl:grid-cols-2';
        stage.append(screen('majlis'), screen('brand1'));
      } else {
        document.documentElement.dataset.brand = mode;
        stage.className = 'grid gap-6 p-4 md:p-6';
        stage.append(screen());
      }
      document.querySelectorAll('.brand-btn').forEach((b) => {
        const on = b.dataset.setBrand === mode;
        b.classList.toggle('bg-action-primary-bg', on);
        b.classList.toggle('text-action-primary-text', on);
        b.setAttribute('aria-pressed', on);
      });
      try { localStorage.setItem('majlis-demo-brand', mode); } catch (e) {}
    }
    document.querySelectorAll('.brand-btn').forEach((b) => b.addEventListener('click', () => show(b.dataset.setBrand)));
    let saved = 'majlis';
    try { saved = localStorage.getItem('majlis-demo-brand') || 'majlis'; } catch (e) {}
    show(saved);
  </script>
</body>
</html>
