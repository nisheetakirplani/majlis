        <div class="flex w-full flex-col gap-2 rounded-[16px] border border-border-glass bg-surface-glass p-4 shadow-[0_2px_4px_0_var(--shadow-color-contact),0_4px_8px_0_var(--shadow-color-ambient)]">
          <div class="flex w-full items-center gap-2">
            <p class="min-w-px flex-1 font-body text-[length:var(--font-size-sm)] font-semibold leading-[var(--font-line-height-18)] text-text-primary tabular-nums">57.5k / 200k</p>
            <p class="font-body text-[length:var(--font-size-xs)] font-normal leading-[var(--font-line-height-16)] text-text-secondary tabular-nums">28.75%</p>
          </div>
          <div class="relative h-1 w-full overflow-clip rounded-full bg-progress-track" role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" aria-label="Usage">
            <div class="absolute inset-y-0 left-0 right-3/4 rounded-full bg-progress-fill"></div>
          </div>
        </div>
      </aside>
    </section>
  </template>

  <script>
    const stage = document.getElementById('stage');
    const tpl = document.getElementById('screen');
    function screen(brand) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      if (brand) node.dataset.brand = brand;
      return node;
    }
    function show(mode) {
      stage.replaceChildren();
      if (mode === 'compare') {
        stage.append(screen('majlis'), screen('brand1'));
      } else {
        document.documentElement.dataset.brand = mode;
        stage.append(screen());
      }
      document.querySelectorAll('.brand-btn').forEach((b) => {
        const on = b.dataset.setBrand === mode;
        b.classList.toggle('bg-action-primary-bg', on);
        b.classList.toggle('text-action-primary-text', on);
        b.setAttribute('aria-pressed', on);
      });
      try { localStorage.setItem('majlis-demo-brand', mode); } catch (e) {}
    }
    document.querySelectorAll('.brand-btn').forEach((b) => b.addEventListener('click', () => show(b.dataset.setBrand)));
    let saved = 'majlis';
    try { saved = localStorage.getItem('majlis-demo-brand') || 'majlis'; } catch (e) {}
    show(saved);
  </script>
</body>
</html>
