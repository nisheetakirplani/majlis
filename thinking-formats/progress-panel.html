<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Majlis progress panel</title>
<!--
  MAJLIS · PROGRESS PANEL
  Standalone version of the staged narrative option, in the Majlis chat shell.
  The work arrives as conversation (thought, short message, step), then folds to one line above the answer.
  Scenario data lives in SCENARIOS (one object per scenario). Add a scenario by copying one entry,
  then add its key to SCENARIO_ORDER. Cite sources with [[sourceId]] or [[sourceId#row]] / [[sourceId#paraId]].
  Selecting a scenario (or the active one again) replays the run.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --bgimg:radial-gradient(1100px 720px at 6% 108%,rgba(196,231,143,.75),transparent 62%),radial-gradient(820px 540px at 102% -6%,rgba(77,187,187,.22),transparent 60%);
  --surface:#ffffff; --surface-2:#f6f8f5; --surface-3:#eaeee8; --glass:rgba(255,255,255,.66); --glass-line:rgba(255,255,255,.92);
  --ink:#1c2420; --ink-2:#3f4944; --muted:#56615b; --faint:#8b958f; --line:rgba(28,40,34,.12); --line-2:rgba(28,40,34,.08);
  --accent:#0b825a; --accent-ink:#ffffff; --accent-text:#064933; --accent-soft:rgba(11,130,90,.12); --accent-line:rgba(11,130,90,.35);
  --deep:#143a2d; --deep-ink:#e9f5d6; --lime:#d3ee9a; --user:#18211d; --user-ink:#ffffff;
  --warn:#6b4708; --warn-bg:#fdecc8; --warn-line:#efd08f; --amber:#f5b73c;
  --bad:#9b3524; --bad-bg:#fbe8e4; --good:#0b825a; --good-bg:rgba(11,130,90,.1);
  --info:#2c4a7a; --info-bg:#e6ecf5; --lock:#4a4f63; --lock-bg:#eceef4;
  --chart-1:#0b825a; --chart-2:#b4c2ba; --chart-3:#2c4a7a; --chart-hi:#f5b73c;
  --shadow:0 1px 2px rgba(28,40,34,.04),0 10px 30px rgba(28,40,34,.05); --shadow-lg:0 24px 60px rgba(28,40,34,.18);
  --focus:0 0 0 3px rgba(11,130,90,.4);
  --sans:"Host Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-io:cubic-bezier(.4,0,.2,1);
  --d-fast:120ms; --d-base:240ms; --d-reveal:280ms; --d-tick:320ms; --d-bar:400ms; --d-count:700ms; --d-draw:700ms;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);border-radius:8px}
h1,h2,h3,h4,p,ol,ul,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
code,.mono{font-family:var(--mono);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
.top__row{display:flex;align-items:center;gap:16px;padding:10px 24px;flex-wrap:wrap}
.top__row+.top__row{padding-top:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-inline-end:8px}
.orb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#d9f7e8 0,#5fd9a5 26%,#0b825a 66%,#064933 100%);flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-3)}
.tab{height:34px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.ctl__label{font-size:12px;font-weight:600;color:var(--muted);text-transform:none}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-3)}
.seg button{height:30px;padding:0 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent-line)}
.btn--primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 6px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.switch i{position:relative;width:32px;height:18px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line);transition:background var(--d-fast)}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform var(--d-base) var(--ease-out),background var(--d-fast)}
.switch[aria-checked="true"] i{background:var(--accent)}
.switch[aria-checked="true"] i::after{transform:translateX(14px);background:var(--accent-ink)}
.ctl-only-proto[hidden]{display:none!important}

/* ---------- views ---------- */
main{padding:20px 24px 40px}
.view[hidden]{display:none}
.wrap{max-width:1320px;margin:0 auto}

/* ---------- option intro ---------- */
.intro{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:end;margin-bottom:14px}
.intro h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.intro p{font-size:13.5px;color:var(--ink-2);max-width:880px}
.intro p b{font-weight:600;color:var(--ink)}
.intro__meta{font-size:12.5px;color:var(--muted);text-align:end}

/* ---------- chat frame ---------- */
.frame{position:relative;display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:600px;border-radius:22px;background:var(--surface-2);border:1px solid var(--line-2);box-shadow:var(--shadow);overflow:hidden}
.frame__head{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-bottom:1px solid var(--line-2);background:var(--surface);flex:none}
.frame__head b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--surface-3);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.frame__body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.frame.has-panel .frame__body{grid-template-columns:minmax(0,1fr) 420px}
.convo{overflow-y:auto;padding:24px 28px 12px;scroll-behavior:auto}
.thread{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.dock{flex:none;padding:8px 24px 16px;border-top:1px solid var(--line-2);background:var(--surface)}
.dock__in{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.input{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:14px}
.input span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.input i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--bg)}

/* ---------- cue (thinking / working / settled) ---------- */
.cue{position:relative;display:flex;align-items:center;gap:10px;min-height:32px;font-size:13px;color:var(--ink-2)}
.cue__mark{position:relative;width:18px;height:18px;flex:none}
.cue__mark::before{content:"";position:absolute;inset:2px;border-radius:4px;background:var(--surface-3);border:1.5px solid var(--line)}
.cue[data-state="thinking"] .cue__mark::before{background:linear-gradient(135deg,var(--lime),var(--accent));border-color:transparent;animation:breathe 1600ms var(--ease-io) infinite}
.cue[data-state="working"] .cue__mark::before{background:linear-gradient(135deg,var(--accent),var(--deep));border-color:transparent;animation:turn 1200ms var(--ease-io) infinite}
.cue[data-state="settled"] .cue__mark::before{background:var(--accent);border-color:transparent;border-radius:50%;transition:border-radius var(--d-base) var(--ease-out)}
.cue[data-state="settled"] .cue__mark::after{content:"";position:absolute;left:6px;top:4px;width:5px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.cue__label b{font-weight:600;color:var(--ink)}
.cue__meta{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes breathe{0%,100%{transform:scale(.86);opacity:.75}50%{transform:scale(1);opacity:1}}
@keyframes turn{0%{transform:rotate(0)}40%,100%{transform:rotate(90deg)}}

/* ---------- conversation atoms ---------- */
.u{align-self:flex-end;max-width:78%;padding:11px 16px;border-radius:16px 16px 4px 16px;background:var(--ink);color:var(--bg);font-size:14.5px}
.b{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;align-items:start}
.b>.orb{width:26px;height:26px;margin-top:1px}
.b__body{min-width:0;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.5}
.msg .ln{opacity:1}
.reveal .ln{animation:lineIn var(--d-reveal) var(--ease-out) both}
.reveal .ln:nth-child(2){animation-delay:120ms}
@keyframes lineIn{from{opacity:0;transform:translateY(6px)}}
.enter{animation:enter var(--d-reveal) var(--ease-out) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

.thought{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.thought__btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:26px;padding:0 10px 0 8px;border-radius:8px;font-size:13px;color:var(--muted)}
.thought__btn:hover{background:var(--surface-3);color:var(--ink-2)}
.thought__btn svg{transition:transform var(--d-base) var(--ease-out)}
.thought__btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.thought.is-live .thought__btn{color:var(--ink-2)}
.thought .dotp{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:breathe 1600ms var(--ease-io) infinite}
.thought__note{padding:8px 12px;border-left:2px solid var(--line);font-size:13px;color:var(--ink-2)}
.thought__note small{display:block;font-size:12px;color:var(--muted)}

.step{border-radius:14px;background:var(--surface);border:1px solid var(--line-2);overflow:hidden}
.step__h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;width:100%;text-align:start}
.step__h b{display:block;font-size:13.5px;font-weight:600}
.step__h small{display:block;font-size:12.5px;color:var(--muted)}
.step__t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.step__b{padding:0 14px 12px 46px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.step.is-conflict{border-color:var(--warn-line)}
.step.is-locked{border-color:var(--line)}

.st{position:relative;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none}
.st--q{border:1.5px dashed var(--line)}
.st--w{border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 900ms linear infinite}
.st--d{background:var(--good);color:var(--accent-ink)}
.st--f{background:var(--warn-bg);color:var(--warn);border:1.5px solid var(--warn-line)}
.st--l{background:var(--lock-bg);color:var(--lock);border:1.5px solid var(--line)}
.st--d svg path{stroke-dasharray:24;stroke-dashoffset:0}
.tick .st--d svg path{animation:tickDraw var(--d-tick) var(--ease-out) both}
@keyframes tickDraw{from{stroke-dashoffset:24}}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.badge--warn{background:var(--warn-bg);color:var(--warn)}
.badge--lock{background:var(--lock-bg);color:var(--lock)}
.badge--good{background:var(--good-bg);color:var(--good)}
.badge--info{background:var(--info-bg);color:var(--info)}
.badge--plain{background:var(--surface-3);color:var(--ink-2)}

.disc{border-radius:12px;border:1px solid var(--line-2);background:var(--surface)}
.disc>summary{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;cursor:pointer;font-size:13.5px;font-weight:600;list-style:none;border-radius:12px}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary svg{transition:transform var(--d-base) var(--ease-out);color:var(--muted)}
.disc[open]>summary svg{transform:rotate(90deg)}
.disc>summary small{font-weight:500;color:var(--muted);font-size:12.5px}
.disc__b{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:13px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;margin:0 2px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;vertical-align:1px;white-space:nowrap;transition:background var(--d-fast),color var(--d-fast),box-shadow var(--d-fast)}
.chip:hover,.chip:focus-visible,.chip.is-hot{background:var(--accent);color:var(--accent-ink)}
.chip.is-locked{background:var(--lock-bg);color:var(--lock)}
.chip.is-locked:hover,.chip.is-locked:focus-visible{background:var(--lock);color:var(--surface)}
.chip svg{flex:none}
.chip{max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ---------- answer anatomy ---------- */
.ans{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.ans__k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ans__line{font-size:18px;line-height:1.45;font-weight:600;letter-spacing:-.005em}
.ans__line.is-flash{animation:flash 900ms var(--ease-out)}
@keyframes flash{0%{background:var(--warn-bg)}100%{background:transparent}}
.conf{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px;border-radius:12px;font-size:13px;background:var(--surface-2);border:1px solid var(--line-2)}
.conf b{font-weight:700}
.conf--high b.lvl{color:var(--good)}
.conf--medium b.lvl{color:var(--warn)}
.conf--low b.lvl{color:var(--bad)}
.conf--draft b.lvl{color:var(--info)}
.conf .gaps{color:var(--ink-2)}
.ev__h{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.ev__h b{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.blocks{display:flex;flex-direction:column;gap:12px}
.blk{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface)}
.blk__t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.blk__f{font-size:12px;color:var(--muted)}

.metric{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.metric__v{font-size:40px;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric__v small{font-size:20px;font-weight:600;margin-left:2px}
.delta{display:inline-flex;align-items:center;align-self:flex-start;gap:5px;min-height:24px;padding:3px 9px;line-height:1.35;border-radius:7px;font-size:12.5px;font-weight:600}
.delta--bad{background:var(--bad-bg);color:var(--bad)}
.delta--good{background:var(--good-bg);color:var(--good)}
.delta--none{background:var(--surface-3);color:var(--ink-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.kpi small{font-size:12px;color:var(--muted)}
.kpi b{font-size:22px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:0}
.tbl th button{display:flex;align-items:center;gap:4px;width:100%;padding:7px 8px;font-size:12px;font-weight:600;color:inherit;text-align:inherit;justify-content:inherit}
.tbl th.r,.tbl td.r{text-align:end}
.tbl th.r button{justify-content:flex-end}
.tbl th button .ar{opacity:.35}
.tbl th[aria-sort="ascending"] .ar,.tbl th[aria-sort="descending"] .ar{opacity:1}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2)}
.tbl tr.hi td{background:var(--warn-bg)}
.tbl tr.hi td:first-child{box-shadow:inset 3px 0 0 var(--chart-hi);font-weight:600}
.tbl tr.cited td{background:var(--accent-soft)}
.tbl tr.cited td:first-child{box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.tbl caption{caption-side:bottom;text-align:start;padding-top:6px;font-size:12px;color:var(--muted)}

.chart>svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line-2)}
.chart .axis{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px}
.draw .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 500ms var(--ease-out) both}
.draw .hbar{transform-box:fill-box;transform-origin:0 50%;animation:growx 500ms var(--ease-out) both}
.draw .ln-path{stroke-dasharray:1;stroke-dashoffset:0;animation:dash var(--d-draw) var(--ease-out) both}
.draw .pt{animation:fadeIn 200ms var(--ease-out) both;animation-delay:600ms}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes dash{from{stroke-dashoffset:1}}
@keyframes fadeIn{from{opacity:0}}

.conflict{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conflict__c{padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2)}
.conflict__c.used{border-color:var(--accent-line);background:var(--accent-soft)}
.conflict__c b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.conflict__c small{display:block;font-size:12px;color:var(--muted)}
.blk--warn{border-color:var(--warn-line);background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}
.blk--lock{border-color:var(--line);background:var(--lock-bg)}

.quote{padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.55}
.quote mark{background:var(--warn-bg);color:inherit;padding:0 2px;border-radius:3px;box-shadow:0 0 0 1px var(--warn-line)}

.acts{display:flex;flex-direction:column;gap:8px;counter-reset:a}
.act{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.act::before{counter-increment:a;content:counter(a);display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--deep);color:var(--deep-ink);font-size:12px;font-weight:700}
.act b{display:block;font-size:13.5px;font-weight:600;line-height:1.4}
.act small{display:block;font-size:12px;color:var(--muted);margin-top:3px}

.audit{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
.audit td{padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.audit td:first-child{color:var(--muted);white-space:nowrap}
.audit td:nth-child(2){white-space:nowrap;color:var(--ink-2)}
.steps-list{display:flex;flex-direction:column;gap:8px}
.steps-list li{padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.steps-list b{display:block;font-size:13px;font-weight:600}
.steps-list small{display:block;font-size:12px;color:var(--muted)}
.steps-list code{display:block;margin-top:4px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}

.agents{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2)}
.agents__h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.agent{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;font-size:13px;padding:4px 0;border-top:1px solid var(--line-2)}
.agent:first-of-type{border-top:0}
.agent b{font-weight:600}
.agent .sk{color:var(--muted)}
.agent.is-off b,.agent.is-off span{color:var(--muted)}

.pair{display:flex;flex-direction:column;gap:2px;font-size:13px}
.pair span{color:var(--ink-2)}
.pair b{font-weight:600;color:var(--ink)}

/* ---------- option: plan card ---------- */
.pc{border-radius:18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);overflow:hidden}
.pc__h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 16px 12px}
.pc__t{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.pc__t small{font-weight:500;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pc__bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pc__bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width var(--d-bar) var(--ease-out)}
.pc__tog{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line)}
.pc__tog svg{transition:transform var(--d-base) var(--ease-out)}
.pc__tog[aria-expanded="true"] svg{transform:rotate(180deg)}
.pc__rows{border-top:1px solid var(--line-2)}
.pc__rows[hidden]{display:none}
.pr{border-top:1px solid var(--line-2)}
.pr:first-child{border-top:0}
.pr__h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px}
.pr__h b{font-size:13.5px;font-weight:600}
.pr.is-q .pr__h b{color:var(--muted);font-weight:500}
.pr.is-w{background:var(--surface-2)}
.pr__say{padding:0 16px 8px 48px;font-size:13px;color:var(--ink-2)}
.pr__res{padding:0 16px 10px 48px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pr__live{padding:0 16px 8px 48px}
.pc__foot{border-top:1px solid var(--line-2);padding:10px 16px;background:var(--surface-2)}

/* ---------- option: compact log ---------- */
.log{border-radius:14px;background:var(--surface);border:1px solid var(--line-2);font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow:hidden}
.log__now{position:sticky;top:0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:12.5px}
.log__now span:first-child{color:var(--muted)}
.ll{border-top:1px solid var(--line-2)}
.ll:first-child{border-top:0}
.ll__h{display:grid;grid-template-columns:64px 128px minmax(0,1fr) 64px;gap:8px;align-items:baseline;width:100%;padding:5px 12px;text-align:start;font-family:var(--mono);font-size:12.5px}
button.ll__h:hover{background:var(--surface-2)}
.ll__k{font-weight:700}
.ll__k.ok{color:var(--good)}.ll__k.run{color:var(--info)}.ll__k.warn{color:var(--warn)}.ll__k.lock{color:var(--lock)}.ll__k.dim{color:var(--muted);font-weight:500}
.ll__tool{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll__msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll__msg.say{font-family:var(--sans);font-size:13px;color:var(--ink-2);white-space:normal}
.ll__dur{text-align:end;color:var(--muted)}
.ll__b{padding:4px 12px 10px 84px;font-family:var(--sans);font-size:13px;display:flex;flex-direction:column;gap:6px}
.ll__b[hidden]{display:none}

/* ---------- option: answer-first with evidence panel ---------- */
.panel{border-left:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.panel[hidden]{display:none}
.ptabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line-2)}
.ptab{position:relative;height:36px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.ptab[aria-selected="true"]{color:var(--ink)}
.ptab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.ptab em{font-style:normal;font-weight:600;margin-left:4px;padding:1px 6px;border-radius:6px;background:var(--surface-3);font-size:12px;color:var(--ink-2)}
.ppane{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ppane[hidden]{display:none}
.wk{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:13px}
.wk b{font-weight:600}
.wk small{display:block;font-size:12px;color:var(--muted)}
.srcitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);transition:border-color var(--d-fast),background var(--d-fast)}
.srcitem b{font-size:13px;font-weight:600}
.srcitem small{grid-column:1/-1;font-size:12px;color:var(--muted)}
.srcitem.is-linked,.srcitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.draftnote{font-size:12.5px;color:var(--info)}

/* ---------- source viewer sheet ---------- */
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(520px,100vw);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform var(--d-base) var(--ease-out);visibility:hidden}
.sheet.is-open{transform:none;visibility:visible}
.sheet__h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.sheet__h h3{font-size:15px;font-weight:600}
.sheet__h small{display:block;font-size:12.5px;color:var(--muted)}
.xbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);margin-inline-start:auto;flex:none}
.sheet__b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.srcdoc p{padding:8px 10px;border-radius:8px;line-height:1.55}
.srcdoc p.cited{background:var(--warn-bg);box-shadow:inset 3px 0 0 var(--chart-hi)}
.srcdoc p.cited.pulse{animation:pulseHi 900ms var(--ease-out)}
@keyframes pulseHi{0%{box-shadow:inset 3px 0 0 var(--chart-hi),0 0 0 6px var(--warn-line)}100%{box-shadow:inset 3px 0 0 var(--chart-hi),0 0 0 0 transparent}}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv span{color:var(--muted)}

/* ---------- reasoning pins and note ---------- */
.why-on [data-why]{position:relative;outline:1.5px dashed var(--info);outline-offset:3px;border-radius:inherit}
.pin{position:absolute;z-index:6;top:-11px;right:-11px;display:grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--info);color:var(--surface);font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2);font-family:var(--sans);line-height:1}
.pin:hover,.pin.is-on{background:var(--ink);color:var(--bg)}
.note{position:fixed;z-index:60;right:24px;bottom:24px;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow-y:auto;padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.note[hidden]{display:none}
.note h3{font-size:15px;font-weight:600;padding-right:40px}
.note dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:0}
.note dt{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.note dd{margin:0;color:var(--ink-2)}
.note .xbtn{position:absolute;top:14px;right:14px}
.etag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700}
.etag--r{background:var(--good-bg);color:var(--good)}
.etag--h{background:var(--info-bg);color:var(--info)}

/* ---------- compare / motion / test ---------- */
.doc{display:flex;flex-direction:column;gap:18px}
.doc__h h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.doc__h p{font-size:14px;color:var(--ink-2);max-width:900px;margin-top:4px}
.card{padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.hyp{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:12.5px;font-weight:700}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;text-align:start}
.cmp thead th{font-size:12.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.cmp tbody th{font-weight:600;width:170px}
.cmp tbody th small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.score{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.score i{display:flex;gap:2px}
.score i b{width:8px;height:12px;border-radius:2px;background:var(--surface-3)}
.score i b.on{background:var(--accent)}
.score+p{margin-top:4px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.cmp tr.total td,.cmp tr.total th{background:var(--surface-2);font-weight:700}
.cmp td.best{background:var(--accent-soft)}
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th,.mtable td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:start;vertical-align:top}
.mtable th{font-size:12px;color:var(--muted);font-weight:600}
.mtable td b{font-weight:600}
.demo{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.qlist{counter-reset:q;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.qlist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}
.qlist li::before{counter-increment:q;content:counter(q);display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--surface-3);font-size:12px;font-weight:700;color:var(--ink-2)}
.change{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:13px;border:1px solid var(--warn-line)}
.change b{font-weight:700}
.rec{padding:18px 20px;border-radius:18px;background:var(--deep);color:var(--deep-ink)}
.rec h3{color:#fff;font-size:17px;margin-bottom:6px}
.rec p,.rec li{font-size:14px;line-height:1.55;color:var(--deep-ink)}
.rec ul{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.rec li{padding-left:16px;position:relative}
.rec li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:2px;background:var(--lime)}
.rec .hyp{background:rgba(255,255,255,.12);color:#fff}


/* chart fills and strokes */
.chart .c1{fill:var(--chart-1)}.chart .c2{fill:var(--chart-2)}.chart .chi{fill:var(--chart-hi)}
.chart .s1{stroke:var(--chart-1)}.chart .s2{stroke:var(--chart-2)}
.msg--sm{font-size:13.5px;color:var(--ink-2)}
.why-on summary{position:relative}
.why-on .pc,.why-on .step,.why-on .log{overflow:visible}
.frame__head>.pin{top:6px;right:8px}
.cue>.pin{top:-6px;right:-6px}
.intro .pin{top:-6px;right:-6px}


/* ================= Majlis shell ================= */
html,body{height:100%}
body{background-color:var(--bg);background-image:var(--bgimg);background-attachment:fixed;overflow:hidden}
.u{background:var(--user);color:var(--user-ink);font-size:15px;line-height:21px;padding:12px 18px}
.chip{color:var(--accent-text)}
.chip:hover,.chip:focus-visible{background:var(--accent);color:var(--accent-ink)}
.scbar{display:flex;align-items:center;gap:12px;height:60px;padding:0 24px}
.scbar .ctl__label{font-size:13px;font-weight:600;color:var(--muted)}
.scbar .seg{padding:4px;border-radius:14px;background:var(--surface-3)}
.scbar .seg button{height:34px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500}
.scbar .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(28,40,34,.12)}
.app{display:flex;height:calc(100vh - 60px);padding:0 12px 12px;gap:12px;min-height:560px}
.rail{flex:0 0 256px;width:256px;min-width:0;display:flex;flex-direction:column;gap:6px;padding:16px 12px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.rail{transition:flex-basis var(--d-base) var(--ease-out),width var(--d-base) var(--ease-out),padding var(--d-base) var(--ease-out)}
.rail__top{display:flex;align-items:center;gap:8px;height:36px;margin:0 0 8px;flex:none}
.rail__brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-left:6px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden}
.rail__brand .orb{width:22px;height:22px}
.rail__tog{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--muted);flex:none}
.rail__tog:hover{background:var(--surface-3);color:var(--ink)}
.rail__chev{transition:transform var(--d-base) var(--ease-out);transform-origin:14px 12px}
.app.is-collapsed .rail{flex-basis:68px;width:68px;padding:16px 10px;align-items:center}
.app.is-collapsed .rail__brand,.app.is-collapsed .rail h4,.app.is-collapsed #recents,.app.is-collapsed .rail .hi,.app.is-collapsed .me>span,.app.is-collapsed .me>svg{display:none}
.app.is-collapsed .rail__top{justify-content:center}
.app.is-collapsed .rail__chev{transform:scaleX(-1)}
.app.is-collapsed .newc{width:44px;padding:0;font-size:0;gap:0}
.app.is-collapsed .srch{width:44px;padding:0;justify-content:center;font-size:0;gap:0}
.app.is-collapsed .me{padding:4px;border:0;background:none}
.newc{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:99px;background:var(--user);color:var(--user-ink);font-size:14px;font-weight:600;flex:none}
.srch{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface-3);color:var(--muted);font-size:13.5px;margin:6px 0 2px;flex:none}
.rail h4{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 8px 2px}
.hi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-size:13.5px;white-space:nowrap;text-align:start}
.hi span{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hi:hover{background:var(--surface-3);color:var(--ink)}
.hi.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.hi svg{flex:none;color:var(--faint)}
.hi .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);flex:none;text-align:start}
.me i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lime);color:#27360d;font-style:normal;font-size:12px;font-weight:700;flex:none}
.me b{display:block;font-size:13px;font-weight:600}.me small{display:block;font-size:12px;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;height:72px;padding:0 16px 0 28px;flex:none}
.mh b{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);color:var(--muted);flex:none}
.frame__body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px}
.chatcol{min-width:0;min-height:0;display:flex;flex-direction:column}
.convo{flex:1;min-height:0;overflow-y:auto;padding:8px 28px 12px}
.thread{max-width:760px;gap:18px}
.foot{flex:none;width:100%;max-width:820px;margin:0 auto;padding:6px 28px 6px;display:flex;flex-direction:column;gap:8px}
.ask{display:flex;align-items:center;gap:6px;height:64px;padding:0 8px 0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow)}
.agt{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px 0 6px;border-radius:99px;background:var(--surface-3);font-size:13.5px;font-weight:600;flex:none;color:var(--ink)}
.agt i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--accent)}
.ask .ph{flex:1;min-width:0;padding:0 10px;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .mic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--muted)}
.ask .snd{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--user);color:var(--user-ink)}
.disclaim{text-align:center;font-size:12px;color:var(--muted)}
.panel{border:1px solid var(--glass-line);border-radius:24px;background:var(--glass);box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(6px)}
.ptabs{padding:12px 14px 0;border-bottom:1px solid var(--line-2)}
.ptab em{background:var(--surface-3)}
.ppane{padding:14px 16px 18px}
.panel__h{display:flex;align-items:center;gap:10px;padding:16px 18px 4px}
.panel__h b{font-size:15px;font-weight:600}
.panel__h small{font-size:12.5px;color:var(--muted);margin-inline-start:auto}
.ans{padding:4px 0 8px;border:0;border-radius:0;background:none;box-shadow:none}
.conf{background:none;border:0;padding:0}
.br{padding:4px 0 8px}
.br__lead{background:var(--surface);border:1px solid var(--line-2)}
.cue__meta{display:none}
/* slow-run offer */
.slow{display:none!important;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 4px 26px;font-size:13px;color:var(--ink-2);animation:lineIn var(--d-reveal) var(--ease-out) both}
.slow button{height:28px;padding:0 12px;border-radius:99px;background:var(--user);color:var(--user-ink);font-size:12.5px;font-weight:600}
.slow.is-set{color:var(--accent-text)}
.rtoast{position:fixed;left:50%;top:14px;z-index:70;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;background:var(--user);color:var(--user-ink);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);transform:translate(-50%,-16px);opacity:0;pointer-events:none;transition:transform 260ms var(--ease-out),opacity 200ms var(--ease-out)}
.rtoast.is-on{transform:translate(-50%,0);opacity:1}
/* follow-ups: compact chips just above the input */
.fchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 4px}
.fchip svg{flex:none;color:var(--accent-text)}
.fchips[hidden]{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(28,40,34,.04);font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;animation:lineIn var(--d-reveal) var(--ease-out) both;transition:background var(--d-fast),color var(--d-fast),border-color var(--d-fast)}
.fchip:hover,.fchip:focus-visible{border-color:var(--accent-line);color:var(--accent-text)}
#inputText.is-typed{color:var(--ink)}
/* status line button + agents popover */
.actv{position:relative}
.actv__top{min-height:36px}
.agbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);flex:none;transition:background var(--d-fast)}
.agbtn:hover{background:var(--surface-3)}
.agbtn svg{transition:transform var(--d-base) var(--ease-out)}
.agbtn[aria-expanded="true"]{background:var(--surface);box-shadow:var(--shadow)}
.agbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.agbtn__av{display:flex}
.agbtn__av:empty{display:none}
.agbtn__av i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;margin-left:-6px;border:2px solid var(--bg);font-style:normal;font-size:9px;font-weight:700;color:#fff;animation:avIn 280ms var(--ease-out) both}
.agbtn__av i:first-child{margin-left:0}
.agbtn__av i.is-w{box-shadow:0 0 0 2px var(--accent-line)}
@keyframes avIn{from{transform:scale(.4);opacity:0}}
.agbtn__av i.ag-data,.agi__av.ag-data i{background:#0b825a}.agbtn__av i.ag-analysis,.agi__av.ag-analysis i{background:#2c4a7a}.agbtn__av i.ag-doc,.agi__av.ag-doc i{background:#7a4f9c}
.agpop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:8;padding:16px 18px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(28,40,34,.16);opacity:0;transform:translateY(8px) scale(.98);transform-origin:50% 100%;transition:opacity 200ms var(--ease-out),transform 260ms var(--ease-out)}
.agpop.is-open{opacity:1;transform:none}
.agpop__h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.agpop__h b{font-size:15px;font-weight:500}
.agpop__h span{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.agpop__list{display:flex;flex-direction:column;gap:2px}
.agi{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 0;animation:rowIn 320ms var(--ease-out) both}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}}
.agi__st{display:grid;place-items:center;width:20px;height:20px;color:var(--accent)}
.agi__st .ck{stroke-dasharray:24;animation:tickDraw 360ms var(--ease-out) both}
.agi__av i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.agi__t{min-width:0}
.agi__t b{display:block;font-size:14px;font-weight:500}
.agi__t small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agi.is-w .agi__t small{color:var(--ink-2)}
.agi__n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.agi.is-d .agi__av i{opacity:.75}
.dgrid{display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.dgrid i{width:4px;height:4px;border-radius:1px;background:var(--ink);opacity:.15;animation:dgrid 1200ms steps(1) infinite}
.dgrid i:nth-child(1){animation-delay:0ms}.dgrid i:nth-child(2){animation-delay:130ms}.dgrid i:nth-child(3){animation-delay:260ms}
.dgrid i:nth-child(6){animation-delay:390ms}.dgrid i:nth-child(9){animation-delay:520ms}.dgrid i:nth-child(8){animation-delay:650ms}
.dgrid i:nth-child(7){animation-delay:780ms}.dgrid i:nth-child(4){animation-delay:910ms}.dgrid i:nth-child(5){animation-delay:1040ms}
@keyframes dgrid{0%{opacity:1}30%{opacity:.55}60%,100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.agpop{transition:none}.dgrid i{animation:none;opacity:.6}}
.ans__k .memc{text-transform:none;letter-spacing:0}
.memc{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;font-weight:600}
.blk{border-radius:16px}
.kpi{border-radius:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi b{font-size:22px}
.ev__h{flex-wrap:wrap;gap:4px 12px}
.cue{padding:0}
/* activity card above the input: live state only */
.actv{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.actv__bar{display:none!important}
.actv__live .thought.is-live{display:none}
.actv[data-state="idle"]{display:none}
.actv__top{display:flex;align-items:center;gap:12px}
.actv__top .cue{flex:1;min-width:0}
.actv__view{flex:none;height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--accent-text);background:var(--accent-soft)}
.actv__bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.actv__bar b{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width var(--d-bar) var(--ease-out)}
.actv[data-state="done"] .actv__bar{display:none}
.actv__live{display:flex;flex-direction:column;gap:6px;padding-left:28px}
.actv__live:empty{display:none}
.actv__live .thought__btn{padding-left:0}
.actv__live .msg{font-size:14px;color:var(--ink-2)}
/* staged narrative: single column, no evidence panel */
.app:not(.has-panel) .frame__body{grid-template-columns:minmax(0,1fr)}
.app:not(.has-panel) .panel{display:none}
.nwork{display:flex;flex-direction:column;gap:10px}
.nwork.is-folded{display:none}
.nwork .msg{font-size:15px;color:var(--ink)}
.nwork .msg .ln{line-height:1.6}
.ns{border-radius:12px;transition:background var(--d-fast)}
.ns__h{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:8px 10px;border-radius:12px;text-align:start}
.ns__h:not(:disabled):hover{background:var(--surface)}
.ns .st{margin-top:1px}
.ns__t b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.ns__t small{display:block;font-size:13.5px;color:var(--ink-2);margin-top:1px}
.ns__m{display:flex;align-items:center;gap:8px;margin-top:6px}
.ns__m .sk{font-size:12.5px;color:var(--muted)}
.ns__d{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.ns__d svg{transition:transform var(--d-base) var(--ease-out)}
.ns__h[aria-expanded="true"] .ns__d svg{transform:rotate(90deg)}
.ns.is-w .ns__t b{color:var(--ink-2)}
.ns__b{padding:2px 10px 12px 44px;font-size:13px}
.ns__b[hidden]{display:none}
.nfold{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:34px;padding:0 12px 0 8px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background var(--d-fast)}
.nfold:hover{background:var(--surface)}
.nfold__i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.nfold__c{color:var(--muted);display:grid;transition:transform var(--d-base) var(--ease-out)}
.nfold[aria-expanded="true"] .nfold__c{transform:rotate(90deg)}
.nfold[aria-expanded="true"]+.nwork{padding:4px 0 8px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
/* narrative: plan, agents, sources */
.nplan{border:0;background:none}
.nplan>summary{display:inline-flex;align-items:center;gap:10px;min-height:36px;padding:0 10px 0 6px;cursor:pointer;list-style:none;border-radius:16px}
.nplan>summary::-webkit-details-marker{display:none}
.nplan>summary::marker{content:""}
.nplan>summary svg{color:var(--muted);transition:transform var(--d-base) var(--ease-out)}
.nplan[open]>summary svg{transform:rotate(90deg)}
.nplan>summary b{font-size:14.5px;font-weight:600}
.nplan>summary small{font-size:13px;color:var(--muted)}
.nplan__l{display:flex;flex-direction:column;padding:0 0 4px 6px}
.nplan>summary:hover{background:var(--surface)}
.npr{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:7px 0}
.npr .st{margin-top:1px}
.npr b{display:block;font-size:14px;font-weight:600}
.npr small{display:block;font-size:12.5px;color:var(--muted)}
.npr.is-d b{font-weight:500;color:var(--muted)}
.nwork .agents{border-radius:16px}
.nsrc{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line-2)}
.nsrc__h{display:flex;align-items:baseline;gap:10px}
.nsrc__h b{font-size:13px;font-weight:600;color:var(--muted)}
.nsrc__h span{font-size:12.5px;color:var(--faint)}
.nsrc ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.nsrc__i.chip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:auto;min-height:56px;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);text-align:start;white-space:normal}
.nsrc__i.chip:hover,.nsrc__i.chip:focus-visible{background:var(--surface);border-color:var(--accent-line);color:var(--ink)}
.nsrc__t{min-width:0;flex:1}
.nsrc__i.chip span{overflow:visible}
.nsrc__i .badge{flex:none}
.nsrc__t b{display:block;font-size:13px;font-weight:600}
.nsrc__t small{display:block;font-size:12px;color:var(--muted);font-weight:500}
/* ---- stream alignment: one 22px gutter for every beat ---- */
.nwork{gap:6px}
.nwork>.msg{margin:2px 0 8px}
.npv{margin:0 0 2px 34px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.nwork .ns__h{padding:6px 0;gap:12px}
.nwork .ns__h:not(:disabled):hover{background:none}
.nwork .ns__h:not(:disabled):hover .ns__t b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.nwork .ns{margin-bottom:8px}
.nwork .ns__b{padding:2px 0 10px 34px}
.nwork .agents{margin:4px 0 0 34px}
.nwork .thought__btn{padding-left:0}
/* ---- executive answer ---- */
.xa{display:flex;flex-direction:column;gap:18px;padding:6px 0 4px}
.xa__lead{font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.005em}
.fig{font-weight:700;font-variant-numeric:tabular-nums}
.was{color:var(--muted);font-weight:400}
.sref{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:2px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink-2);vertical-align:5px;line-height:1;transition:background var(--d-fast),color var(--d-fast),border-color var(--d-fast)}
.sref:hover,.sref:focus-visible{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cert{display:inline-flex;align-items:center;height:20px;padding:0 7px;margin-left:6px;border-radius:6px;border:1px dashed var(--line);font-size:11.5px;font-weight:600;color:var(--muted);vertical-align:1px}
.xa__conf{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.xa__conf b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--faint)}
.dot--high{background:var(--accent)}.dot--medium{background:var(--amber)}.dot--low{background:var(--bad)}
.xa__gaps{display:flex;flex-direction:column;gap:3px;padding-left:16px;font-size:13.5px}
.xa__gaps b{font-weight:600}
.xa__sec{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--line-2)}
.xa__sec h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.xa__sec h4:first-child{margin-top:0}
.xa__pts{display:flex;flex-direction:column;gap:6px}
.xa__pts li{position:relative;padding-left:18px;font-size:15px;line-height:1.6}
.xa__pts li::before{content:"";position:absolute;left:3px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--ink-2)}
.xa__src{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line-2)}
.xa__cur{font-size:13px;color:var(--muted)}
.xa__cur b{color:var(--ink-2);font-weight:600}
.srows{display:flex;flex-direction:column}
.srows.is-short li:nth-child(n+4){display:none}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:34px;padding:2px 6px;border-radius:8px;text-align:start;font-size:13px}
.srow:hover,.srow:focus-visible{background:var(--surface)}
.srow__n{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink-2)}
.srow__t{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow__s{font-size:12px;color:var(--muted);white-space:nowrap}
.srow__s.is-conflict{color:var(--warn)}.srow__s.is-locked{color:var(--lock)}
.xa__more{align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent-text);padding:2px 6px}
.xa__more:hover{text-decoration:underline;text-underline-offset:3px}
/* ---- findings-first stream ---- */
.ffd{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px;padding:14px 0 16px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.ffd__h{display:flex;align-items:baseline;gap:10px}
.ffd__k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ffd__n{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ffd__l{display:flex;flex-direction:column;gap:8px}
.ffd__l:empty{display:none}
.ffr,.ffd__now{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start}
.ffr .st,.ffd__now .st{margin-top:2px}
.ffr__t{font-size:15px;line-height:1.55;color:var(--ink)}
.ffr__t .badge{margin-left:6px;vertical-align:1px}
.ffd__now{font-size:14px;color:var(--muted)}
.ffd__nt{line-height:1.55}
.shim{background:linear-gradient(90deg,var(--muted) 0,var(--muted) 40%,#b9c6bf 50%,var(--muted) 60%,var(--muted) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimx 1.8s linear infinite}
@keyframes shimx{from{background-position:150% 0}to{background-position:-50% 0}}
.nwork{gap:10px}
/* ---- hierarchy refinements ---- */
/* process: quieter, smaller, set apart */
.ffd{gap:8px;margin:4px 0 0;padding:12px 14px 12px 16px;border:0;border-left:2px solid var(--line);border-radius:0;background:none}
.ffd__k{font-size:11.5px;letter-spacing:.07em}
.ffd__l{gap:6px}
.ffr,.ffd__now{grid-template-columns:16px minmax(0,1fr);gap:10px}
.ffr .st,.ffd__now .st{width:16px;height:16px;margin-top:2px}
.ffr .st svg{width:9px;height:9px}
.ffr__t{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.ffr__t .fig{font-weight:600;color:var(--ink)}
.ffr__t .badge{height:18px;font-size:11px;padding:0 6px}
.ffr__t .sref{min-width:15px;height:15px;font-size:10px;vertical-align:3px}
.ffd__now{font-size:13px}
/* answer: clearly separate, its own header */
.xa{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);gap:20px}
.xa__head{display:flex;align-items:baseline;gap:10px}
.xa__title{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.xa__head .xa__from::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--faint);margin:0 10px 3px 0}
.xa__badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;font-weight:700}
.xa__badge svg{width:12px;height:12px}
.xa__from{font-size:12.5px;color:var(--muted)}
.xa__lead{font-size:20px;line-height:1.5}
.sref{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-soft)}
/* actions: lead only, the rest folded */
.xa__also{margin-top:4px}
.xa__also>summary{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 6px;border-radius:9px;cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.xa__also>summary::-webkit-details-marker{display:none}
.xa__also>summary::marker{content:""}
.xa__also>summary:hover{background:var(--surface)}
.xa__also>summary svg{color:var(--muted);transition:transform var(--d-base) var(--ease-out)}
.xa__also[open]>summary svg{transform:rotate(90deg)}
.xa__also ol{display:flex;flex-direction:column;gap:10px;padding:8px 0 0 6px}
.xa__also li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:14.5px;line-height:1.5}
.xa__also li i{font-style:normal;font-size:13px;font-weight:600;color:var(--muted)}
.xa__also b{font-weight:500}
.xa__also small{display:block;font-size:12.5px;color:var(--muted)}
/* sources: clearly tappable rows */
.xa__srch{display:flex;align-items:baseline;gap:10px}
.xa__srch h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.xa__srch span{font-size:12.5px;color:var(--faint)}
.srows{gap:6px}
.srow{grid-template-columns:22px minmax(0,1fr) auto auto;gap:12px;min-height:46px;padding:6px 10px 6px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);font-size:13.5px;transition:border-color var(--d-fast),box-shadow var(--d-fast)}
.srow:hover,.srow:focus-visible{background:var(--surface);border-color:var(--accent-line);box-shadow:0 2px 10px rgba(28,40,34,.06)}
.srow__n{border-color:var(--accent-line);color:var(--accent-text);background:var(--accent-soft)}
.srow__t{font-weight:500}
.srow__go{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--accent-text)}
.srow__go svg{transition:transform var(--d-base) var(--ease-out)}
.srow:hover .srow__go svg{transform:translateX(2px)}
.xa__cur{margin-top:4px}
/* answer hierarchy: text first */
.br{gap:18px;padding:22px 24px}
.br .ans__line{font-size:19px;line-height:1.5}
.br__conf{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.br__conf b.lvl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
.br__conf.conf--medium b.lvl::before{background:var(--amber)}
.br__conf.conf--high b.lvl::before{background:var(--accent)}
.br__conf b.lvl{font-weight:600;color:var(--ink)}
.br__gaps{display:flex;flex-direction:column;gap:4px}
.br__gaps li{position:relative;padding-left:14px}
.br__gaps li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.br__sec{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line-2)}
.br__sec h4{font-size:13px;font-weight:600;color:var(--muted)}
.br__pts{display:flex;flex-direction:column;gap:10px}
.br__pts li{position:relative;padding-left:18px;font-size:15px;line-height:1.6}
.br__pts li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
.br__acts{display:flex;flex-direction:column;gap:12px;counter-reset:n}
.br__acts li{position:relative;padding-left:32px;font-size:15px;line-height:1.5}
.br__acts li::before{counter-increment:n;content:counter(n);position:absolute;left:0;top:1px;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--surface-3);font-size:12px;font-weight:700;color:var(--ink-2)}
.br__acts b{font-weight:500}
.br__acts small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.br__lead{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2)}
.br__lk{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.br__lead b{font-size:16px;font-weight:600;line-height:1.45}
.br__lead small{font-size:13px;color:var(--muted)}
.br__lead p{font-size:14px;color:var(--ink-2);margin-top:2px}
.br__also{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.br__also>span{font-size:13px;font-weight:600;color:var(--muted)}
.br__also ol{display:flex;flex-direction:column;gap:10px}
.br__also li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:14.5px;line-height:1.5}
.br__also li i{font-style:normal;font-size:13px;font-weight:600;color:var(--muted);padding-top:1px}
.br__also b{font-weight:500}
.br__also small{display:block;font-size:12.5px;color:var(--muted)}
.br__foot{font-size:12.5px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line-2)}
.chip--s{height:20px;padding:0 7px;font-size:12px;margin-left:4px}

.ans--wait{gap:14px}
.skl{display:flex;flex-direction:column;gap:8px}
.skl i{display:block;border-radius:6px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.waitnote{font-size:13px;color:var(--muted)}
.blk__t--stack{flex-direction:column;align-items:flex-start;gap:2px}
.blk__t--stack small{font-size:12.5px;font-weight:500;color:var(--muted)}
.anslinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alink{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px;font-weight:600;text-align:start}
.alink small{font-weight:500;color:var(--muted);font-size:12.5px;flex:1}
.alink:hover{border-color:var(--accent-line)}
/* evidence panel: steps list */
.pempty{font-size:13px;color:var(--muted)}
.wsteps{display:flex;flex-direction:column}
.ws{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 4px;border-top:1px solid var(--line-2)}
.ws:first-child{border-top:0;padding-top:4px}
.ws .st{margin-top:1px}
.ws__b b{display:block;font-size:13.5px;font-weight:600}
.ws__b small{display:block;font-size:12.5px;color:var(--muted)}
.agstrip{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 4px}
.agstrip,.agstrip[hidden]{display:none!important}
.b>.orb{display:none}
.b{grid-template-columns:minmax(0,1fr)}
.agstrip__k{flex:none;font-size:12px;font-weight:600;color:var(--muted);line-height:28px}
.agrow{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.agp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 3px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;transition:border-color var(--d-base),box-shadow var(--d-base),background var(--d-base)}
.agp i,.agtag i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;font-style:normal;font-size:10px;font-weight:700;flex:none;color:#fff}
.agp b{font-weight:600;white-space:nowrap}
.agp small{min-width:18px;height:18px;padding:0 5px;border-radius:6px;background:var(--surface-3);font-size:11.5px;font-weight:600;color:var(--ink-2);display:grid;place-items:center}
.agp:hover{border-color:var(--line)}
.agp.is-on{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.agp.is-sel{background:var(--ink);border-color:var(--ink);color:#fff}
.agp.is-sel small{background:rgba(255,255,255,.18);color:#fff}
.ag-data i{background:#0b825a}.ag-analysis i{background:#2c4a7a}.ag-doc i{background:#7a4f9c}
.agtag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 3px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink)}
.agtag i{width:18px;height:18px;border-radius:6px;font-size:9.5px}
.agtag.ag-data{background:rgba(11,130,90,.10)}.agtag.ag-analysis{background:rgba(44,74,122,.10)}.agtag.ag-doc{background:rgba(122,79,156,.10)}
.ws__who{display:flex!important;align-items:center;gap:8px;margin-top:6px}
.ws__who[hidden]{display:none!important}
.ws__who .sk{font-size:12.5px;color:var(--muted)}
.ws.is-dim{opacity:.35}
.ws{transition:opacity var(--d-base)}
.ws__why{color:var(--ink-2)!important;margin-top:2px}
.ws__why:empty{display:none}
.ws.is-d .ws__b b{color:var(--muted);font-weight:500}
.st--think{position:relative;width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--lime),var(--accent));animation:breathe 1600ms var(--ease-io) infinite}
.ws.is-q .ws__b b{color:var(--muted);font-weight:500}
.ws.is-w{background:var(--surface-2);border-radius:12px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.ws__res{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.ws__t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.wsec{margin-top:8px}
.sdh{font-size:15px;font-weight:600}
.srclist,.srcdetail{display:flex;flex-direction:column;gap:8px}
.srcdetail{gap:12px}
.sheet{border-radius:24px 0 0 24px}
@media (max-width:1100px){.frame__body{grid-template-columns:minmax(0,1fr) 360px}}
@media (max-width:900px){
  body{overflow:auto}
  .rail{display:none}
  .app{height:auto;padding:0 8px 8px}
  .frame__body{grid-template-columns:1fr}
  .convo{max-height:none;overflow:visible;padding:8px 12px}
  .panel{min-height:420px}
  .mh{padding:0 8px 0 12px}
  .foot{padding:6px 8px}
  .scbar{padding:0 12px}
}

/* instant mode and reduced motion: no animation, no transition */
.no-anim *,.no-anim *::before,.no-anim *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .cue[data-state="thinking"] .cue__mark::before,.cue[data-state="working"] .cue__mark::before,.thought .dotp,.st--w{animation:none!important}
  .st--w{border-color:var(--accent)}
}
@media (max-width:980px){
  .top__row{padding:10px 16px}
  .top{position:static}
  .tabs{flex-wrap:wrap}
  .tab{white-space:nowrap;padding:0 10px}
  .ctl{flex-wrap:wrap;min-width:0;max-width:100%}
  .seg{flex-wrap:wrap;max-width:100%}
  main{padding:16px}
  .intro{grid-template-columns:1fr}
  .intro__meta{text-align:start}
  .convo{padding:16px}
  .dock{padding:8px 12px 12px}
  .conflict{grid-template-columns:1fr}
  .note dl{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .frame.has-panel .frame__body{grid-template-columns:minmax(0,1fr)}
  .frame.has-panel .panel{border-left:0;border-top:1px solid var(--line-2);max-height:45vh}
  .agent{grid-template-columns:1fr}
  .ll__h{grid-template-columns:56px minmax(0,1fr) 56px}
  .ll__tool{display:none}
}

.ans.br{padding:4px 0 8px}

/* ===== progress panel version ===== */
.app.has-panel .frame__body{grid-template-columns:minmax(0,1fr) 380px}
.sp{display:flex;flex-direction:column;min-height:0;padding:0;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;animation:spIn .32s var(--ease-out) both}
@keyframes spIn{from{opacity:0;transform:translateX(16px)}}
.sp__h{display:flex;align-items:center;gap:10px;padding:18px 16px 12px 22px;flex:none}
.sp__h b{font-size:16px;font-weight:600}
.sp__meta{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sp__x{margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.sp__x:hover{background:var(--surface-3);color:var(--ink)}
.sp__body,.sp__detail{flex:1;min-height:0;overflow-y:auto;padding:0 22px 22px}
.sp__body[hidden],.sp__detail[hidden]{display:none}
.sp__sec{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2)}
.sp__sec[hidden]{display:none}
.sp__sec h4{font-size:15px;font-weight:600;margin-bottom:10px}
/* progress rail */
.ri__more{display:block;margin:0 0 4px 24px;font-size:13.5px;color:var(--muted)}
.ri__more:hover{color:var(--ink)}
.prail{position:relative;display:flex;flex-direction:column;gap:14px;padding:4px 0}
.prail::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--line)}
.ri{position:relative;display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px}
.ri.is-old{display:none}
.ri__dot{position:relative;z-index:1;width:12px;height:12px;margin-top:5px;border-radius:50%;background:transparent}
.ri.is-cur .ri__dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:breathe 1.6s ease-in-out infinite}
.ri.is-done .ri__dot{width:6px;height:6px;margin:8px 0 0 3px;background:var(--line)}
.ri.st-f .ri__dot{background:var(--amber)}.ri.st-l .ri__dot{background:var(--lock)}
.ri__t{font-size:14.5px;line-height:1.45;color:var(--muted)}
.ri.is-cur .ri__t{color:var(--ink);font-weight:500}
.ri__f{font-size:13px;line-height:1.5;color:var(--ink-2);margin-top:3px}
.ri__f .fig{font-weight:600;color:var(--ink)}
.ri__f .badge{height:18px;font-size:11px;padding:0 6px;margin-left:6px;vertical-align:1px}
.ri__m{font-size:12px;color:var(--faint);margin-top:2px}
.ri .sref{min-width:15px;height:15px;font-size:10px;vertical-align:3px}
/* sources */
.sps{display:flex;flex-direction:column;gap:6px}
.spr{display:grid;grid-template-columns:20px minmax(0,1fr) 16px;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);text-align:start;transition:border-color var(--d-fast),background var(--d-fast)}
.spr:hover,.spr:focus-visible{border-color:var(--accent-line);background:var(--surface)}
.spr__n{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text);font-size:11px;font-weight:700}
.spr__t b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spr__t small{display:block;font-size:12px;color:var(--muted)}
.spr__t small.is-conflict{color:var(--warn)}.spr__t small.is-locked{color:var(--lock)}
.spr__go{display:grid;color:var(--faint);transition:transform var(--d-base) var(--ease-out),color var(--d-fast)}
.spr:hover .spr__go{transform:translateX(2px);color:var(--accent-text)}
/* used in this response */
.spu{display:flex;flex-direction:column;gap:10px}
.spu__r{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:13.5px}
.spu__k{color:var(--muted)}
.spu__v{display:flex;flex-wrap:wrap;gap:6px;color:var(--ink)}
.spa{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 3px;border-radius:8px;background:var(--surface-3);font-size:12.5px;font-weight:500}
.spa i{display:grid;place-items:center;width:18px;height:18px;border-radius:6px;font-style:normal;font-size:9.5px;font-weight:700;color:#fff}
.spa.ag-data i{background:#0b825a}.spa.ag-analysis i{background:#2c4a7a}.spa.ag-doc i{background:#7a4f9c}
/* source detail inside panel */
.sp__back{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 6px;margin:0 0 12px -6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--accent-text)}
.sp__back:hover{background:var(--surface-3)}
.sp__dh{margin-bottom:12px}
.sp__dh small{display:block;font-size:12px;color:var(--muted)}
.sp__dh b{display:block;font-size:15px;font-weight:600}
.sp__detail .kv{font-size:12.5px}
.sp__detail .tbl{font-size:12.5px}
/* collapsible sources */
.sp__tog{display:flex;align-items:center;gap:8px;width:100%;height:36px;margin:-4px 0 6px;padding:0 6px 0 0;border-radius:10px;text-align:start}
.sp__tog span{font-size:15px;font-weight:600}
.sp__tog em{font-style:normal;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2)}
.sp__chev{margin-left:auto;color:var(--muted);transition:transform var(--d-base) var(--ease-out)}
.sp__tog:hover .sp__chev{color:var(--ink)}
.sp__sec.is-closed .sp__chev{transform:rotate(-90deg)}
.sp__coll{display:grid;grid-template-rows:1fr;transition:grid-template-rows 280ms var(--ease-out),opacity 200ms var(--ease-out)}
.sp__coll>ol{min-height:0;overflow:hidden}
.sp__sec.is-closed .sp__coll{grid-template-rows:0fr;opacity:0}
.sp__sec.is-closed .sp__tog{margin-bottom:-8px}
/* chat ticker: one line only */
.tkr{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;max-width:100%;min-height:34px;padding:0 12px 0 8px;border-radius:10px;font-size:14px;color:var(--ink-2);text-align:start;transition:background var(--d-fast)}
.tkr:hover{background:var(--surface)}
.tkr>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkr__dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:breathe 1.6s ease-in-out infinite}
.tkr__a{color:var(--muted);flex:none}
.tkr__s{color:var(--faint);flex:none}
.tkr__ok{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff}
.tkr__ok svg{width:10px;height:10px}
.tkr__go{display:inline-flex;align-items:center;gap:2px;margin-left:6px;font-weight:600;color:var(--accent-text);flex:none}
.xa{margin-top:10px;padding-top:0;border-top:0}
.xa__cur--solo{padding-top:14px;border-top:1px solid var(--line-2)}
@media (max-width:1100px){.app.has-panel .frame__body{grid-template-columns:minmax(0,1fr) 340px}}
</style>
</head>
<body>
<div class="scbar">
  <span class="ctl__label" id="lbl-sc">Scenario</span>

</div>

<div class="app is-collapsed" id="frame">
  <nav class="rail" id="rail" aria-label="Chats">
    <div class="rail__top"><span class="rail__brand"><span class="orb" aria-hidden="true"></span>Majlis</span>
      <button class="rail__tog" id="railTog" type="button" aria-expanded="false" aria-controls="rail" aria-label="Expand sidebar" title="Expand sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path class="rail__chev" d="M15 10l-2 2 2 2"/></svg></button></div>
    <button class="newc" type="button" title="New chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="srch" title="Search chats"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search chats</div>
    <h4>Pinned</h4>
    <button class="hi" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 7 4 3H6l4-3z"/><path d="M12 13v8"/></svg><span>Q3 pipeline by region</span><i class="dot"></i></button>
    <button class="hi" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 7 4 3H6l4-3z"/><path d="M12 13v8"/></svg><span>Northwind renewal</span><i class="dot"></i></button>
    <h4>Recent</h4>
    <div id="recents"></div>
    <button class="me" type="button"><i>SH</i><span style="flex:1"><b>Syed Hafeez</b><small>Back to dashboard</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  </nav>

  <div class="main">
    <header class="mh">
      <b id="frameQ" hidden></b><span style="flex:1"></span>
      <button class="ib" type="button" id="panelTog" aria-label="Show progress panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h7M4 12h11M4 18h5"/><path d="M14 6h6M18 12h2M12 18h8" opacity=".45"/></svg></button>
      <button class="ib" type="button" aria-label="Pin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 7 4 3H6l4-3z"/><path d="M12 13v8"/></svg></button>
      <button class="ib" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div class="frame__body">
      <div class="chatcol">
        <div class="convo" id="convo" tabindex="0" aria-label="Conversation"><div class="thread" id="thread"></div></div>

          <div class="fchips" id="fchips" role="group" aria-label="Suggested follow-ups" hidden></div>
          <div class="actv" id="act" data-state="idle" aria-label="Majlis activity">
            <section class="agpop" id="agPop" aria-label="Agents in progress" hidden>
              <div class="agpop__h"><b>Agents in progress</b><span id="agPopN"></span></div>
              <ul class="agpop__list" id="agPopList"></ul>

            <div class="actv__top">

                <span class="cue__mark" aria-hidden="true"></span>
                <span class="cue__label" id="cueLabel" aria-live="polite"><b>Ready</b></span>
                <span class="cue__meta" id="cueMeta"></span>
              </div>
              <button class="agbtn" id="agBtn" type="button" aria-expanded="false" aria-controls="agPop" hidden><span class="agbtn__av" id="agBtnAv" aria-hidden="true"></span><span id="agBtnT">View agents in progress</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
            </div>

            <div class="actv__bar" aria-hidden="true"><b id="actBar"></b></div>
            <div class="actv__live" id="actLive"></div>
          </div>
          <div class="ask" aria-hidden="true"><span class="agt"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg></i>Institutional Memory<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span><span class="ph" id="inputText">Ask about your company…</span><span class="mic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span><span class="snd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
          <p class="disclaim">Majlis can make mistakes. Check important figures before acting.</p>
        </div>

      <aside class="panel sp" id="panel" aria-label="Progress" hidden></aside>

</div>

<script>

      '<section class="sp__sec" id="spSrc" hidden><button type="button" class="sp__tog" aria-expanded="true" aria-controls="spSrcList"><span>Sources</span><em id="spSrcN">0</em>' + '<svg class="sp__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><div class="sp__coll" id="spSrcList"><ol class="sps"></ol></div></section>' +
