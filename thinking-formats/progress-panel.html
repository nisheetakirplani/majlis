          ticker('<span class="tkr__ok">' + I.check + '</span><span class="tkr__a">' + tkFirst + '</span><span class="tkr__s">·</span><span>Worked for ' + secs(ev.at) + "s · " + N + ' steps</span><span class="tkr__go">View progress' + CHV + "</span>", false);
          body.appendChild(narrAnswer(sc, { noSources: true }));
          fc.innerHTML = (FOLLOWUPS[S.sc] || []).map((f, i) => '<button type="button" class="fchip" style="animation-delay:' + (i * 60) + 'ms" data-fup="' + esc(f[1]) + '">' + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>' + esc(f[1]) + "</button>").join("");
          fc.hidden = !fc.children.length;
          break;
        }
      }
    }
  };
};

/* =====================================================================
   START: scenario switcher only. Selecting a scenario, or the active one again, replays it.
   ===================================================================== */
const OLDER = ["Q3 forecast variance", "Supplier indemnity clauses", "Board pack summary"];
function toastMsg(t) {
  let el = $("#readyToast"); if (!el) { el = frag('<div class="rtoast" id="readyToast" role="status"></div>'); document.body.appendChild(el); }
  el.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' + esc(t);
  el.classList.remove("is-on"); void el.offsetWidth; el.classList.add("is-on");
  clearTimeout(toastMsg.t); toastMsg.t = setTimeout(() => el.classList.remove("is-on"), 3200);
}
function renderRecents() {
  const ic = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';
  $("#recents").innerHTML = SCENARIO_ORDER.map((k) => '<button class="hi' + (k === S.sc ? " on" : "") + '" type="button" data-sc="' + k + '"' + (k === S.sc ? ' aria-current="true"' : "") + ">" + ic + "<span>" + esc(SCENARIOS[k].query) + "</span></button>").join("") +
    OLDER.map((t) => '<button class="hi" type="button">' + ic + "<span>" + esc(t) + "</span></button>").join("");
}
function pickScenario(v) {
  S.sc = v;
  $$("#scSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.v === v)));
  play();
}
function init() {
  S.op = "side"; S.speed = "1"; S.why = false;
  $("#scSeg").innerHTML = SCENARIO_ORDER.map((k) => '<button type="button" data-v="' + k + '" aria-pressed="' + (k === S.sc) + '">' + esc(SCENARIOS[k].label) + "</button>").join("");
  $("#scSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) pickScenario(b.dataset.v); });
  $("#recents").addEventListener("click", (e) => { const b = e.target.closest("[data-sc]"); if (b) pickScenario(b.dataset.sc); });
  $("#panelTog").addEventListener("click", () => $("#frame").classList.toggle("has-panel"));
  $("#railTog").addEventListener("click", () => {
    const app = $("#frame"), c = !app.classList.contains("is-collapsed");
    app.classList.toggle("is-collapsed", c);
    const t = $("#railTog"); t.setAttribute("aria-expanded", String(!c)); t.setAttribute("aria-label", c ? "Expand sidebar" : "Collapse sidebar"); t.title = t.getAttribute("aria-label");
  });
  $("#sheetClose").addEventListener("click", () => closeSheet());
  $("#noteClose").addEventListener("click", closeNote);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { const p = $("#agPop"); if (!p.hidden) { $("#agBtn").click(); $("#agBtn").focus(); } else closeSheet(); } });
  document.addEventListener("click", (e) => { const f = e.target.closest("[data-fup]"); if (!f) return; const t = $("#inputText"); t.textContent = f.dataset.fup; t.classList.add("is-typed"); $(".ask").classList.add("is-ready"); $("#fchips").hidden = true; });
  document.addEventListener("click", (e) => { const p = $("#agPop"); if (!p.hidden && !e.target.closest("#agPop,#agBtn")) $("#agBtn").click(); });
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-open]"); if (b && RUN && RUN.handler.selectTab) RUN.handler.selectTab(b.dataset.open, true); });
  play();
}
init();
</script>
