:root[data-theme="dark"] .hero__ask::before{background:radial-gradient(circle,rgba(62,213,152,.2),transparent 65%)}
.hero__ask>*{position:relative}
.ask__top{display:flex;align-items:center;gap:14px}.ask__t h2{font:600 22px/26px var(--font);letter-spacing:-.02em}.ask__t p{font-size:13px;color:var(--ink3);margin-top:2px}

/* ---------- Schedule section ---------- */
/* Schedule · next up + day strip: a focus card for one meeting, stepped with Next ›, mirrored on the strip */
.cal{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}

.cal__st{position:relative;height:40px;border-radius:10px;background:var(--tile);flex:none;margin-top:auto}
.cal__st button{position:absolute;top:5px;bottom:5px;border-radius:7px;background:var(--mc);opacity:.72;transition:opacity .2s,box-shadow .2s,transform .2s;min-width:6px}.cal__st button:hover{opacity:1;transform:translateY(-1px)}

.cb__x{display:grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--bad);color:#fff;font:700 12px/1 var(--font);flex:none}.cb--q{background:var(--tile)}.cb--q .cb__x{background:var(--c4)}

/* Teams · AI summary */
.tms{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}.tms__by{display:flex;align-items:center;gap:6px;font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

.tms__m{font-size:12.5px;color:var(--ink3)}.tms__a{display:flex;gap:8px;margin-top:auto;flex:none}.tms__a .btn{flex:1;justify-content:center;height:36px}

.sdd--day{--dbg:rgba(245,183,60,.16);--dc:#f5b73c}.sdd--night{--dbg:rgba(139,111,217,.16);--dc:var(--c4)}
.w--v-s .sdc{padding:8px 10px}.w--v-s .sdc strong{font-size:18px}.w--v-s .sdd{display:none}
/* Invites & conflicts */
.inv-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 4px;border-top:1px solid var(--line);font-size:13.5px;min-width:0}.inv-row:first-child{border-top:0}.inv-row>span:not(.inv-n){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inv-row>span b{font-weight:600}.inv-row .btn{height:30px;padding:0 12px;flex:none}
.inv-n{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--tile2);font:700 12.5px/1 var(--font);flex:none}.inv-n--bad{background:var(--bad-soft);color:var(--bad)}
/* Trips & travel */
.trp{display:flex;flex-direction:column;gap:6px;flex:none}.trp small{font:600 11px/1 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}.trp strong{font:600 30px/1.05 var(--font);letter-spacing:-.02em}.trp>span{font-size:12.5px;color:var(--ink3)}

.vtl small{font:500 12px/1.2 var(--font);color:var(--ink3)}.vtl b{font:600 22px/1.1 var(--font);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vtl em{font:600 11.5px/1 var(--font);font-style:normal;color:var(--vc)}

.cvg{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-height:0;justify-content:center}.cvg svg{display:block;width:min(270px,100%);max-height:100%;height:auto;flex:1;min-height:0}.cvg p{margin:0;font-size:12.5px;color:var(--ink3);text-align:center}.cvg p b{color:var(--ink2)}

.hfn{display:flex;align-items:stretch;gap:4px;flex:none}.hfn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border-radius:var(--rs);background:var(--tile);min-width:0;transition:background .15s}.hfn button:hover{background:var(--tile2)}.hfn b{font:600 22px/1 var(--font)}.hfn span{font-size:11.5px;color:var(--ink2);white-space:nowrap}

/* ===== Majlis mascot: animation states (from Majlis_Mascot_Animations), driven by what the product is doing ===== */
:root{--spd:1}.orb{--s:52px}.orb--sm{--s:28px}.orb--md{--s:48px}.orb--lg{--s:64px}.orb--xl{--s:92px}.logo .orb{--s:30px}.home__glow .orb{--s:96px}
.orb .fx{position:absolute;pointer-events:none}.orb .eyes{transition:transform .25s ease-out}
/* 02 look around */
.st-look .eyes{animation:m-look calc(6s/var(--spd)) ease-in-out infinite}
@keyframes m-look{0%,18%,100%{transform:translate(0,0)}24%,40%{transform:translate(-9%,-2%)}46%,62%{transform:translate(9%,-2%)}68%,80%{transform:translate(0,4%)}}

/* 03 follow cursor — JS moves .eyes */
.st-follow .eyes{transition:transform .12s ease-out}

/* 04 listening */
.st-listen{animation:m-breathe calc(1.1s/var(--spd)) ease-in-out infinite}
.st-listen .eyes b{animation:m-listenEye calc(1.1s/var(--spd)) ease-in-out infinite}
@keyframes m-listenEye{50%{transform:scaleY(1.18)}}
.st-listen::before,.st-listen::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #3ed598;animation:m-ripple calc(1.8s/var(--spd)) ease-out infinite;pointer-events:none}
.st-listen::after{animation-delay:calc(.9s/var(--spd))}
@keyframes m-ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}

/* 05 thinking */
.st-think .eyes{animation:m-thinkLook calc(3s/var(--spd)) ease-in-out infinite}
@keyframes m-thinkLook{0%,100%{transform:translate(6%,-7%)}50%{transform:translate(-4%,-7%)}}
.st-think .eyes b{animation:m-blink calc(2.2s/var(--spd)) infinite}
.st-think .sat{position:absolute;inset:-14%;border-radius:50%;animation:m-spin calc(2.4s/var(--spd)) linear infinite}
.st-think .sat i{position:absolute;top:0;left:50%;width:9%;height:9%;margin-left:-4.5%;border-radius:50%;background:#3ed598;box-shadow:0 0 10px #3ed598}
.st-think .sat i:nth-child(2){top:auto;bottom:0;background:#c4e78f;box-shadow:0 0 10px #c4e78f;width:6%;height:6%;margin-left:-3%}
@keyframes m-spin{to{transform:rotate(360deg)}}

/* 06 speaking — JS drives --a (0..1) from a fake audio level */
.st-speak{--a:0;animation:none;transform:scale(calc(1 + var(--a)*.05))}
.st-speak .eyes b{animation:none;transform:scaleY(calc(1 - var(--a)*.35))}
.orb .wave{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:22px}
.orb .wave i{display:block;width:4px;border-radius:2px;background:var(--accent);height:20%;transition:height .08s}

/* 07 happy / success */
.st-happy{animation:m-hop calc(1.6s/var(--spd)) cubic-bezier(.3,.7,.4,1) infinite}
.st-happy .eyes b{animation:none;width:16%;height:13%;background:none;border:calc(var(--s)*.035) solid var(--eye);border-bottom:0;border-radius:99px 99px 0 0;transform:translateY(-20%)}
@keyframes m-hop{0%,60%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.08,.92)}25%{transform:translateY(-16%) scale(.96,1.05)}40%{transform:translateY(0) scale(1.06,.94)}50%{transform:translateY(0) scale(1)}}
.orb .spark{position:absolute;width:10px;height:10px;background:#c4e78f;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:m-spark calc(1.6s/var(--spd)) ease-out infinite;opacity:0}
.orb .spark.a{top:6%;left:4%}.spark.b{top:0;right:8%;animation-delay:calc(.15s/var(--spd))}.spark.c{bottom:14%;right:0;animation-delay:calc(.3s/var(--spd))}
@keyframes m-spark{20%{opacity:1;transform:scale(1.2) rotate(20deg)}60%,100%{opacity:0;transform:scale(.4) rotate(90deg)}}

/* 08 greeting wink */
.st-wink{animation:m-tilt calc(3.2s/var(--spd)) ease-in-out infinite}
.st-wink .eyes b{animation:none}
.st-wink .eyes b:last-child{animation:m-wink calc(3.2s/var(--spd)) ease-in-out infinite}
@keyframes m-wink{0%,30%,55%,100%{transform:scaleY(1)}38%,47%{transform:scaleY(.12)}}
@keyframes m-tilt{0%,25%,60%,100%{transform:rotate(0)}35%,50%{transform:rotate(-10deg)}}

/* 09 attention / notify */
.st-notify{animation:m-nudge calc(2.6s/var(--spd)) ease-in-out infinite}
.st-notify .eyes b{animation:m-wide calc(2.6s/var(--spd)) ease-in-out infinite}
@keyframes m-nudge{0%,55%,100%{transform:translateY(0) rotate(0)}60%{transform:translateY(-8%) rotate(-6deg)}66%{transform:translateY(-8%) rotate(6deg)}72%{transform:translateY(-4%) rotate(-3deg)}78%{transform:translateY(0) rotate(0)}}
@keyframes m-wide{0%,55%,85%,100%{transform:scaleY(1)}62%,78%{transform:scale(1.15,1.2)}}
.orb .badge{position:absolute;top:2%;right:2%;min-width:26%;height:26%;padding:0 6%;border-radius:99px;background:#e2531f;color:#fff;font:700 calc(var(--s)*.14)/1 var(--font);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg);animation:m-pop calc(2.6s/var(--spd)) ease-in-out infinite}
@keyframes m-pop{0%,55%,85%,100%{transform:scale(1)}62%{transform:scale(1.25)}}

/* 10 sleeping / offline */
.st-sleep{animation:m-breathe calc(7s/var(--spd)) ease-in-out infinite;filter:saturate(.35) brightness(.95)}
.st-sleep .eyes{transform:translateY(8%)}
.st-sleep .eyes b{animation:none;height:4%;width:14%;border-radius:99px}
.orb .zz{position:absolute;top:-2%;right:-6%;font:600 calc(var(--s)*.16)/1 var(--font);color:var(--ink3)}
.orb .zz i{position:absolute;font-style:normal;opacity:0;animation:m-z calc(3s/var(--spd)) ease-out infinite}.zz i:nth-child(2){animation-delay:calc(1s/var(--spd));font-size:.75em}.zz i:nth-child(3){animation-delay:calc(2s/var(--spd));font-size:.55em}
@keyframes m-z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(60%,-180%)}}

/* 11 confused / error */
.st-oops{animation:m-shake calc(2.4s/var(--spd)) ease-in-out infinite}
.st-oops .eyes{transform:rotate(-8deg)}
.st-oops .eyes b{animation:none}.st-oops .eyes b:first-child{height:18%}.st-oops .eyes b:last-child{height:30%}
@keyframes m-shake{0%,50%,100%{transform:translateX(0)}56%{transform:translateX(-6%)}62%{transform:translateX(6%)}68%{transform:translateX(-4%)}74%{transform:translateX(3%)}80%{transform:translateX(0)}}
.orb .q{position:absolute;top:-6%;right:2%;font:700 calc(var(--s)*.2)/1 var(--font);color:#f5b73c;animation:m-qbob calc(2.4s/var(--spd)) ease-in-out infinite}
@keyframes m-qbob{50%{transform:translateY(-12%) rotate(12deg)}}

/* 12 working / loading sheen */
.st-load{overflow:hidden}
.st-load::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,255,255,.55) 82%,transparent 92%);animation:m-spin calc(1.4s/var(--spd)) linear infinite;mix-blend-mode:soft-light}
.st-load .eyes b{animation:m-scan calc(1.4s/var(--spd)) ease-in-out infinite}

@keyframes m-scan{0%,100%{transform:translateY(-14%) scaleY(.75)}50%{transform:translateY(14%) scaleY(.75)}}

/* 13 hover squish */
.st-hover{animation:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1);cursor:pointer}
.st-hover:hover{transform:scale(1.08,.92)}
.st-hover:hover .eyes b{animation:none;transform:scaleY(.15)}
.st-hover:active{transform:scale(.9,1.1)}

/* 14 drop into chat — the hero orb lands where the chat opens */
.st-drop{animation:m-drop calc(2.8s/var(--spd)) cubic-bezier(.5,0,.3,1) infinite}
@keyframes m-drop{0%,15%{transform:translateY(-34%) scale(.6);opacity:0}30%{transform:translateY(0) scale(1.08,.9);opacity:1}38%{transform:scale(.96,1.04)}46%,80%{transform:scale(1)}92%,100%{transform:scale(.6);opacity:0}}
