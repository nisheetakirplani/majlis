<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majlis Orbit Mascot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Host Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f2f9f1; --glow:#ffffff; --card:#ffffff; --line:#dfe9df;
  --ink:#1c2420; --ink2:#56615b; --ink3:#8b958f; --accent:#0b825a;
  --is-dark:0; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1311; --glow:#16221d; --card:#16201b; --line:#26322c;
    --ink:#eef3f0; --ink2:#aab5af; --ink3:#76827c; --accent:#3ed598;
    --is-dark:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1311; --glow:#16221d; --card:#16201b; --line:#26322c;
  --ink:#eef3f0; --ink2:#aab5af; --ink3:#76827c; --accent:#3ed598;
  --is-dark:1; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 42%,var(--glow) 0%,var(--bg) 62%);background-color:var(--bg);color:var(--ink);font:400 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 24px 0;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
h1 span{color:var(--ink3);font-weight:500}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 24px;gap:18px}
#stage{width:min(78vh,92vw,760px);aspect-ratio:1/1;display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 16px}
.controls label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.controls input[type=range]{width:130px;accent-color:var(--accent)}
.btn{font:500 13px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.sizes{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.sizes figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sizes canvas{display:block;border-radius:22%;background:var(--card);border:1px solid var(--line)}
.sizes figcaption{font-size:11px;color:var(--ink3)}
@media (max-width:560px){
  header{padding:16px 16px 0}
  .controls{border-radius:18px;padding:10px 12px}
}
</style>
</head>
<body>
<header>
  <h1>Majlis mascot <span>· Orbit</span></h1>
  <button class="btn" id="theme">Dark background</button>
</header>
<main>
  <canvas id="stage" aria-label="Animated mascot: a glossy mint planet with blinking eyes and a spinning orbit ring"></canvas>
  <div class="controls">
    <label>Orbit speed <input type="range" id="speed" min="0" max="3" step="0.05" value="1"></label>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="blink">Blink</button>
  </div>
  <div class="sizes" id="sizes"></div>
</main>

<script>
(() => {
'use strict';
const TAU = Math.PI*2;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const mixRGB = (a,b,t) => a.map((v,i) => Math.round(v+(b[i]-v)*t));
const rgb = (c,a=1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* palette sampled from the reference */
const RING_DARK = hex('#0f8f7b'), RING_MID = hex('#1fa892'), RING_CYAN = hex('#43c9cc'), RING_GLINT = hex('#eafffb'), RING_TIP = hex('#5cc596');
const MOONS = {
  lime: ['#e4f8cf','#93dca6','#3fb08c'],
  teal: ['#c6f3e6','#55c9b4','#14978a'],
  mint: ['#e6fae0','#9fe0b4','#5bbf96'],
};

/* moons: orbit radii / tilt / speed in planet-radius units */
const ORBITERS = [
  {rx:1.32, ry:0.66, tilt:-0.62, speed:0.42, phase:-1.15, r:0.165, kind:'lime'},
  {rx:1.58, ry:0.46, tilt:-0.16, speed:0.30, phase: 3.45, r:0.185, kind:'teal'},
  {rx:1.24, ry:0.74, tilt: 0.42, speed:0.36, phase: 0.95, r:0.16,  kind:'mint'},
  {rx:1.80, ry:0.55, tilt:-0.48, speed:0.55, phase:-0.55, r:0.045, kind:'dot'},
];
const RING = {rx:1.56, ry:0.30, tilt:-0.31, dy:0.14};

const state = {speed:1, paused:false, spin:0, blinkReq:0};

function sphere(ctx,x,y,r,[hi,mid,edge]){
  const g = ctx.createRadialGradient(x-r*0.38, y-r*0.42, r*0.05, x, y, r);
  g.addColorStop(0,hi); g.addColorStop(0.45,mid); g.addColorStop(1,edge);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  const s = ctx.createRadialGradient(x-r*0.4, y-r*0.45, 0, x-r*0.4, y-r*0.45, r*0.45);
  s.addColorStop(0,'rgba(255,255,255,0.85)'); s.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = s; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
}

class OrbitMascot {
  constructor(canvas, fixed=0){
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.fixed = fixed;
    this.blinkAt = performance.now()/1000 + 1.2; this.blinkT = -1;
    this.look = {x:0,y:0};
    this.resize();
  }
  resize(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = this.fixed || this.c.clientWidth || 400, h = this.fixed || this.c.clientHeight || 400;
    if (this.fixed){ this.c.style.width = w+'px'; this.c.style.height = h+'px'; }
    this.c.width = Math.round(w*dpr); this.c.height = Math.round(h*dpr);
    this.w = w; this.h = h; this.dpr = dpr;
  }
  eyeOpen(t){
    if (state.blinkReq > (this.lastReq||0)){ this.lastReq = state.blinkReq; this.blinkT = 0; }
    if (this.blinkT < 0 && t > this.blinkAt) this.blinkT = 0;
    if (this.blinkT < 0) return 1;
    this.blinkT += this.dt;
    const d = 0.2, b = this.blinkT/d;
    if (b >= 1){
      this.blinkT = -1;
      this.blinkAt = t + (Math.random() < 0.18 ? 0.18 : 2.2 + Math.random()*1.8);
      return 1;
    }
    // ease shut then open
    const k = b < 0.45 ? b/0.45 : 1 - (b-0.45)/0.55;
    return 1 - Math.pow(Math.sin(k*Math.PI/2),2)*0.93;
  }
  draw(t, dt){
    this.dt = dt;
    const ctx = this.ctx, w = this.w, h = this.h, S = Math.min(w,h);
    const P = S*0.225, bob = reduceMotion ? 0 : Math.sin(t*1.25)*P*0.04;
    const cx = w/2, cy = h*0.485 + bob, spin = state.spin;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,w,h);

    // ground shadow
    const k = 1 - bob/(P*0.25);
    const sy = h*0.485 + P*1.5;
    const sg = ctx.createRadialGradient(cx, sy, 0, cx, sy, P*1.15*k);
    sg.addColorStop(0, 'rgba(70,150,105,0.20)'); sg.addColorStop(1,'rgba(70,150,105,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(cx, sy, P*1.15*k, P*0.12*k, 0, 0, TAU); ctx.fill();

    // build drawables: ring segments + moons, each with depth
    const back = [], front = [];
    const cr = Math.cos(RING.tilt), sr = Math.sin(RING.tilt);
    const ringPt = th => { const lx = Math.cos(th)*RING.rx*P, ly = Math.sin(th)*RING.ry*P; return [cx + lx*cr - ly*sr, cy + RING.dy*P + lx*sr + ly*cr]; };
    const N = S < 140 ? 90 : 220, dth = TAU/N;
    for (let i=0;i<N;i++){
      const th = i*dth, z = Math.sin(th+dth/2);
      (z < 0 ? back : front).push({type:'seg', th, z});
    }
    for (const o of ORBITERS){
      const th = o.phase + spin*o.speed*1.6;
      const c = Math.cos(o.tilt), s = Math.sin(o.tilt);
      const lx = Math.cos(th)*o.rx*P, ly = Math.sin(th)*o.ry*P, z = Math.sin(th);
      const item = {type:'moon', o, x: cx + lx*c - ly*s, y: cy + lx*s + ly*c + Math.sin(t*1.6+o.phase)*P*0.03, z};
      (z < 0 ? back : front).push(item);
    }
    back.sort((a,b) => a.z-b.z); front.sort((a,b) => a.z-b.z);

    const drawItem = it => {
      if (it.type === 'seg'){
        const th = it.th, z = Math.sin(th);
        const [x1,y1] = ringPt(th), [x2,y2] = ringPt(th+dth*1.02);
        // colour pattern travels around the ring = continuous spin
        const a = th - spin*1.6;
        const cyan = Math.pow(0.5+0.5*Math.cos(a-2.3),2.2);
        const tip = Math.pow(0.5+0.5*Math.cos(a+0.35),6)*0.7;
        let col = mixRGB(RING_DARK, RING_MID, 0.5+0.5*z);
        col = mixRGB(col, RING_CYAN, cyan*0.85);
        col = mixRGB(col, RING_TIP, tip);
        const glint = Math.pow(Math.max(0,Math.cos(a-2.3)),60) + 0.5*Math.pow(Math.max(0,Math.cos(a+0.9)),80);
        col = mixRGB(col, RING_GLINT, clamp(glint,0,1)*0.9);
        const wdt = P*(0.028 + 0.058*Math.pow(0.5+0.5*z,1.4));
        ctx.strokeStyle = rgb(col, z < 0 ? 0.92 : 1);
        ctx.lineWidth = wdt; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      } else {
        const o = it.o, sc = 1 + 0.14*it.z, r = o.r*P*sc;
        ctx.save(); ctx.globalAlpha = it.z < 0 ? 0.9 : 1;
        if (o.kind === 'dot'){ ctx.fillStyle = '#16977c'; ctx.beginPath(); ctx.arc(it.x,it.y,r,0,TAU); ctx.fill(); }
        else sphere(ctx, it.x, it.y, r, MOONS[o.kind]);
        ctx.restore();
      }
    };

    back.forEach(drawItem);
    this.drawPlanet(ctx, cx, cy, P, t);
    front.forEach(drawItem);
    // travelling sparkle on the ring
    const ga = 2.3 + spin*1.6, gz = Math.sin(ga);
    if (gz > -0.3){
      const [gx,gy] = ringPt(ga), a = clamp((gz+0.3)/0.5,0,1);
      const g = ctx.createRadialGradient(gx,gy,0,gx,gy,P*0.22);
      g.addColorStop(0,`rgba(255,255,255,${0.9*a})`); g.addColorStop(0.25,`rgba(190,255,245,${0.45*a})`); g.addColorStop(1,'rgba(190,255,245,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx,gy,P*0.22,0,TAU); ctx.fill();
    }
  }
  drawPlanet(ctx, cx, cy, P, t){
    // soft outer glow
    ctx.save();
    ctx.shadowColor = 'rgba(120,225,190,0.55)'; ctx.shadowBlur = P*0.35;
    const base = ctx.createLinearGradient(cx-P, cy-P, cx+P, cy+P);
    base.addColorStop(0,'#c4f0d6'); base.addColorStop(0.45,'#93dfc6'); base.addColorStop(1,'#56c3bb');
    ctx.fillStyle = base; ctx.beginPath(); ctx.arc(cx,cy,P,0,TAU); ctx.fill();
    ctx.restore();

    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,P,0,TAU); ctx.clip();
    const blob = (x,y,r,c,a) => {
      const g = ctx.createRadialGradient(cx+x*P, cy+y*P, 0, cx+x*P, cy+y*P, r*P);
      g.addColorStop(0, rgb(hex(c),a)); g.addColorStop(1, rgb(hex(c),0));
      ctx.fillStyle = g; ctx.fillRect(cx-P, cy-P, P*2, P*2);
    };
    blob( 0.35,-0.55, 0.75, '#d3efa6', 0.55);   // lime haze top-right
    blob( 0.55, 0.65, 0.70, '#d6efa0', 0.60);   // lime bottom-right
    blob(-0.65, 0.35, 0.80, '#7fd6b3', 0.45);   // green lower-left
    blob( 0.70, 0.05, 0.65, '#46bfc0', 0.45);   // teal right
    blob( 0.00, 0.00, 0.62, '#dcf8ec', 0.70);   // inner glow around the face
    // specular highlight
    const hx = cx-P*0.43, hy = cy-P*0.62;
    const sh = ctx.createRadialGradient(hx, hy, 0, hx, hy, P*0.32);
    sh.addColorStop(0,'rgba(255,255,255,0.95)'); sh.addColorStop(0.35,'rgba(255,255,255,0.55)'); sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(hx, hy, P*0.32, P*0.22, -0.6, 0, TAU); ctx.fill();
    // rim light
    ctx.lineWidth = P*0.06; ctx.strokeStyle = 'rgba(235,255,245,0.28)';
    ctx.beginPath(); ctx.arc(cx,cy,P*0.985,Math.PI*0.75,Math.PI*1.45); ctx.stroke();
    ctx.restore();

    // eyes
    const open = this.eyeOpen(t);
    const ew = P*0.163, eh = P*0.43, ex = P*0.227, ey = cy - P*0.03;
    const lx = this.look.x*P, ly = this.look.y*P;
    for (const s of [-1,1]){
      const h = Math.max(eh*open, ew*0.32);
      const x = cx + s*ex + lx, y = ey + ly;
      const g = ctx.createLinearGradient(0, y-eh/2, 0, y+eh/2);
      g.addColorStop(0,'#0e5640'); g.addColorStop(1,'#052c20');
      ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x-ew/2, y-h/2, ew, h, Math.min(ew,h)/2); ctx.fill();
    }
  }
}

/* ---------- mount ---------- */
const hero = new OrbitMascot(document.getElementById('stage'));
const sizes = document.getElementById('sizes');
const small = [128, 72, 40].map(px => {
  const f = document.createElement('figure');
  f.innerHTML = `<canvas></canvas><figcaption>${px}px</figcaption>`;
  sizes.appendChild(f);
  return new OrbitMascot(f.querySelector('canvas'), px);
});
const all = [hero, ...small];
new ResizeObserver(() => hero.resize()).observe(hero.c);

// eyes drift gently toward the pointer
let ptr = null;
addEventListener('pointermove', e => { ptr = {x:e.clientX, y:e.clientY, t:performance.now()/1000}; }, {passive:true});

document.getElementById('speed').oninput = e => { state.speed = +e.target.value; };
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => { state.paused = !state.paused; pauseBtn.textContent = state.paused ? 'Play' : 'Pause'; };
document.getElementById('blink').onclick = () => { state.blinkReq++; };
const themeBtn = document.getElementById('theme');
const isDark = () => getComputedStyle(document.documentElement).getPropertyValue('--is-dark').trim()==='1';
const syncTheme = () => { themeBtn.textContent = isDark() ? 'Light background' : 'Dark background'; };
themeBtn.onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; syncTheme(); };
syncTheme();

let last = performance.now();
function loop(ms){
  const t = ms/1000, dt = Math.min(0.05,(ms-last)/1000); last = ms;
  if (!state.paused) state.spin += dt*state.speed*(reduceMotion ? 0.4 : 1);
  // look target
  for (const m of all){
    let tx = 0, ty = 0;
    if (ptr && t - ptr.t < 3){
      const r = m.c.getBoundingClientRect(), dx = ptr.x-(r.left+r.width/2), dy = ptr.y-(r.top+r.height/2), d = Math.hypot(dx,dy)||1;
      const k = clamp(d/(r.width*0.8),0,1); tx = dx/d*k*0.06; ty = dy/d*k*0.04;
    }
    m.look.x += (tx-m.look.x)*0.1; m.look.y += (ty-m.look.y)*0.1;
    m.draw(t, dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
