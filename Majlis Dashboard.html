:root[data-theme="dark"] .hero__ask::before{background:radial-gradient(circle,rgba(62,213,152,.2),transparent 65%)}
.hero__ask>*{position:relative}
.ask__top{display:flex;align-items:center;gap:14px}.ask__t h2{font:600 22px/26px var(--font);letter-spacing:-.02em}.ask__t p{font-size:13px;color:var(--ink3);margin-top:2px}

/* ---------- Customize · floating toolbar pill + command palette (replaces the bottom sheet) ---------- */

let _uid = 0; const uid = () => 'u' + (++_uid);

function smoothPath(p) { let d = `M${p[0][0].toFixed(2)} ${p[0][1].toFixed(2)}`; for (let i = 0; i < p.length - 1; i++) { const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
  d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(2)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(2)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(2)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`; } return d; }
/* smooth area chart. series: [{n, v:[], c}] · HTML axes + SVG paths so text never distorts */
function areaChart(series, labels, o = {}) {
  const all = series.flatMap(s => s.v), mx = Math.max(...all), mn = Math.min(...all), step = niceStep(((mx - mn) || mx) / 3.2), hi = Math.ceil(mx / step) * step, lo = Math.max(0, Math.floor(mn / step) * step - step), n = labels.length;
  const X = i => (i + .5) / n * 100, Y = v => 96 - (v - lo) / (hi - lo) * 90, ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const fmt = v => v >= 1000 ? (v / 1000) + 'k' : Number.isInteger(v) ? v : +v.toFixed(1), id = uid();
  const defs = series.map((s, k) => `<linearGradient id="${id}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${s.c};stop-opacity:${k ? .16 : .3}"/><stop offset="1" style="stop-color:${s.c};stop-opacity:0"/></linearGradient>`).join('');
  const paths = [...series].reverse().map(s => { const k = series.indexOf(s), pts = s.v.map((v, i) => [X(i), Y(v)]), ln = smoothPath(pts); return `<path d="${ln} L${X(n - 1)} 100 L${X(0)} 100Z" fill="url(#${id}${k})"/><path d="${ln}" fill="none" style="stroke:${s.c}" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`; }).join('');
  const cols = labels.map((l, i) => { const w = 100 / n, left = i * w, edge = i === 0 ? ' is-l' : i === n - 1 ? ' is-r' : '';
    return `<span class="ac__c${edge}" style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%"><i class="ac__v" style="left:50%"></i>${series.map(s => `<i class="ac__d" style="top:${Y(s.v[i]).toFixed(2)}%;background:${s.c}"></i>`).join('')}<b class="ac__tip"><em>${esc(l)}</em>${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)} <strong>${s.v[i]}</strong></span>`).join('')}</b></span>`; }).join('');
  return `<div class="ac"><div class="ac__y">${[...ticks].reverse().map(v => `<span style="top:${Y(v)}%">${fmt(v)}</span>`).join('')}</div><div class="ac__p">${ticks.map(v => `<i class="ac__g" style="top:${Y(v)}%"></i>`).join('')}<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs>${defs}</defs>${paths}</svg>${cols}</div><div class="ac__x">${labels.map((l, i) => `<span style="left:${X(i).toFixed(2)}%"${n > 9 && i % 2 ? ' class="is-off"' : ''}>${esc(l)}</span>`).join('')}</div></div>`; }

/* Majlis Executive Dashboard v2 · bento grid engine.
   Items are an ORDERED list. Layout is derived: dense first-fit packing on a 12-column grid, then adjacent gaps are
   closed by stretching neighbours (auto-fit). Sizes snap to WIDTHS columns and whole rows, so nothing can float freely. */
const snapW = (v, min, max) => { const c = WIDTHS.filter(x => x >= min && x <= max); return c.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a, c[0] || min); };

function pack(items, auto = true) {
  const occ = [], row = y => occ[y] || (occ[y] = new Array(COLS).fill(0));
  const free = (x, y, w, h) => { for (let j = y; j < y + h; j++) { const r = row(j); for (let i = x; i < x + w; i++) if (r[i]) return false; } return true; };
  const mark = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) { const r = row(j); for (let i = x; i < x + w; i++) r[i] = v; } };
  const pos = new Map(), list = [];
  items.forEach((it, n) => { const w = Math.min(it.w, COLS), h = it.h; let done = false;
    for (let y = 0; !done && y < 80; y++) for (let x = 0; x + w <= COLS; x++) if (free(x, y, w, h)) { const p = { id: it.id, x, y, w, h, n: n + 1, it }; pos.set(it.id, p); list.push(p); mark(x, y, w, h, n + 1);

document.addEventListener('click', e => { const b = e.target.closest('[data-act="pin-open"], [data-act="pin-remove"]'); if (!b) return; const i = S.pins.findIndex(p => p.id === b.dataset.pin); if (i < 0) return; const p = S.pins[i];
  if (b.dataset.act === 'pin-remove') { S.pins.splice(i, 1); pinsChanged(); toast(t('pins.toastU'), t('undo'), () => { S.pins.splice(i, 0, p); pinsChanged(); }); return; }
  const fromHero = !!b.closest('.hero__ask'); p.unread = false; p.q = p.q || t('pins.upd', { x: p.title }); pinsChanged(); openChat(fromHero ? $('#heroAsk') : null); chatSend(p.q); });
$('#chatPin').innerHTML = ico('pin', 18); $('#chatPin').onclick = () => { const q = S.lastQ; if (!q) { toast(t('pins.none')); return; } const i = S.pins.findIndex(p => p.q === q);
  if (i >= 0) { S.pins.splice(i, 1); toast(t('pins.toastU')); } else { S.pins.unshift({ id: 'p' + Date.now().toString(36), ic: 'message', title: q.length > 42 ? q.slice(0, 42) + '…' : q, short: q.length > 16 ? q.slice(0, 15).trim() + '…' : q, sub: t('pins.fresh'), tone: '', at: t('pins.now'), unread: false, q }); toast(t('pins.toastP')); } pinsChanged(); };

/* ---------- boot ---------- */
(function boot() {
  root.dataset.theme = store.get('theme', 'light'); root.lang = LANG; root.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  const mqSide = matchMedia('(max-width:1180px)'), syncSide = () => { const pref = store.get('side', null); app.classList.toggle('is-collapsed', pref === null ? mqSide.matches : pref); }; syncSide(); mqSide.addEventListener?.('change', syncSide);
  Grid.auto = store.get('auto', true); Grid.rtl = LANG === 'ar'; Grid.sec = true; SecBar.init(); Grid.init($('#grid'));
  const p0 = new URLSearchParams(location.search).get('page') || store.get('page', 'overview'); renderTop(); renderNotifs(); renderHero(); setPage(PAGES[p0] ? p0 : 'overview'); syncChat(); tickClocks(); setInterval(tickClocks, 1000);
  window.__sync = 2; setInterval(() => { window.__sync = (window.__sync % 9) + 1; renderHello(); }, 15000);
  $('#sres').hidden = true; $('#notifPop').hidden = true;
})();
